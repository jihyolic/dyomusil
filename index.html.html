<!doctype html>

<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap');
:root{--ink:#25313d;--glass:rgba(255,255,255,.88);--accent:#3c6570}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:'Noto Sans KR',sans-serif;background:#c9d4d8;color:var(--ink)}
#world{position:fixed;inset:0}canvas{display:block}
.top{position:fixed;left:22px;top:18px;z-index:3;color:#fff;text-shadow:0 2px 12px #182b36}
.brand{font-size:25px;font-weight:800;letter-spacing:5px}.tag{font-size:11px;letter-spacing:1px;opacity:.95;margin-top:2px}
.hud{position:fixed;right:18px;top:18px;z-index:3;display:flex;gap:8px;align-items:center}

<div class="top"><div class="brand">됴무실</div><div class="tag">OFFICE STRESS BREAK · 오늘의 스트레스는 여기에 두고 가요</div></div>

  addBox(g,0,1.12,-.38,.12,.22,.12,M.metal);
  addBox(g,0,.99,-.3,.72,.045,.25,M.dark); // keyboard body

  addBox(g,.78,1.0,.35,.24,.018,.2,mat(0xe7d58b)); // sticky note

  addCylinder(g,-1.02,1.12,.28,.105,.11,.24,M.dark);
  for(let n=0;n<5;n++){let pen=addCylinder(g,-1.08+n*.035,1.34,.28,.012,.012,.28,[M.red,M.blue,M.green,M.paper,M.tie][n]);pen.rotation.z=(n-2)*.08}

workstation(-6,-8,0);workstation(0,-8,0);workstation(6,-8,0);

workstation(-12,9,Math.PI);workstation(-6,9,Math.PI);workstation(0,9,Math.PI);workstation(6,9,Math.PI);workstation(12,9,Math.PI);

// Shared office supplies: water dispenser, recycle bins and a stationery shelf.
addBox(scene,13,.85,8,1.1,1.7,.9,M.blue);
addBox(scene,13,1.78,8,.62,.18,.55,M.screen);
addCylinder(scene,13,.28,8.65,.22,.22,.5,M.metal);
for(let x of [-13,13]){addBox(scene,x,.45,2,.65,.9,.65,M.dark);addBox(scene,x,.94,2,.58,.08,.58,M.blue)}

for(let i=0;i<7;i++){addBox(scene,-15.5+i*.16,2.72,7,.12,.72,.55,[M.red,M.blue,M.green,M.tie,M.navy,M.paper,M.blue][i]);addBox(scene,-15.5+i*.16,2.72,7.29,.07,.07,.015,M.paper)}

cabinet(-15,-4);cabinet(-15,0);cabinet(15,-4);cabinet(15,0);
// Printer/copier station and paper trays.
addBox(scene,-13,.75,6,1.8,1.5,1.35,M.paper);

addBox(scene,-13,1.6,6,.62,.025,.48,M.screen);
addBox(scene,-12.5,.25,6.72,.75,.16,.12,M.metal);
// more meeting-room chairs around the conference table
for(const x of [-3.5,-1.5,.5,2.5,4.5,6.5]){
  addBox(scene,x,.55,-8.4,.78,.14,.72,M.blue);

// plants
function plant(x,z){addCylinder(scene,x,.45,z,.25,.34,.9,M.wood);for(let i=0;i<7;i++){let a=i*Math.PI*2/7;let leaf=new THREE.Mesh(new THREE.SphereGeometry(.35,10,8),M.green);leaf.position.set(x+Math.cos(a)*.35,1.35+(i%2)*.15,z+Math.sin(a)*.35);leaf.scale.set(.6,1.5,.55);scene.add(leaf)}}

// clock and whiteboard
addBox(scene,0,3.4,-13.72,5,2.1,.12,M.paper);addBox(scene,0,3.4,-13.62,4.7,1.8,.035,mat(0xf7f6ed));
const clockFace=new THREE.Mesh(new THREE.CircleGeometry(.65,32),mat(0xf5f1e6));clockFace.position.set(14,6,-13.72);scene.add(clockFace);
for(let i=0;i<12;i++){let a=i*Math.PI/6;addBox(scene,14+Math.sin(a)*.5,6+Math.cos(a)*.5,-13.65,.035,.12,.03,M.dark)}

function prop(name,x,z,color,kind='box'){let g=new THREE.Group();scene.add(g);if(kind==='monitor'){addBox(g,0,.45,0,.95,.68,.12,M.dark);addBox(g,0,.46,.075,.82,.53,.025,M.screen);addBox(g,0,.04,0,.12,.25,.12,M.metal);addBox(g,0,-.08,.08,.55,.07,.35,M.metal)}else if(kind==='mug'){addCylinder(g,0,.18,0,.2,.18,.36,mat(color));let h=new THREE.Mesh(new THREE.TorusGeometry(.13,.035,8,16,Math.PI*1.6),mat(color));h.position.set(.2,.2,0);g.add(h)}else if(kind==='chair'){addBox(g,0,.65,0,.9,.15,.8,M.blue);addBox(g,0,1.25,-.32,.9,1,.15,M.blue);addCylinder(g,0,.25,0,.09,.09,.55,M.metal);for(let i=0;i<5;i++){let a=i*Math.PI*2/5;addBox(g,Math.cos(a)*.35,.05,Math.sin(a)*.35,.5,.08,.1,M.metal)}}else{addBox(g,0,.25,0,.65,.5,.55,mat(color));addBox(g,0,.53,0,.6,.06,.5,M.paper)}g.position.set(x,0,z);g.userData={name,kind,held:false,velocity:new THREE.Vector3(),spin:new THREE.Vector3()};props.push(g);return g}
prop('모니터',-10,-4,0,'monitor');prop('머그컵',-8.5,-4,0xc77c54,'mug');prop('서류 더미',-11,3,0,'paper');prop('사무용 의자',-7,2,0,'chair');prop('머그컵',10,3,0x6c9c91,'mug');prop('서류 더미',11,-5,0,'paper');prop('사무용 의자',8,-5,0,'chair');prop('회의 자료',3,-5,0,'paper');prop('머그컵',-1,-5,0xd58d6d,'mug');
// character
const avatar=new THREE.Group();scene.add(avatar);
const torso=addBox(avatar,0,1.08,0,.72,.9,.42,M.suit);
addBox(avatar,0,1.48,.015,.7,.18,.43,M.shirt); // collar
const tie=addBox(avatar,0,1.23,.235,.12,.43,.045,M.tie);
const head=new THREE.Mesh(new THREE.SphereGeometry(.31,18,14),M.skin);head.position.set(0,1.92,0);head.castShadow=true;avatar.add(head);
const hair=new THREE.Mesh(new THREE.SphereGeometry(.325,16,12,0,Math.PI*2,0,Math.PI*.58),M.hair);hair.position.set(0,2.02,-.025);avatar.add(hair);
for(let x of [-.13,.13]){let eye=new THREE.Mesh(new THREE.SphereGeometry(.027,8,8),M.dark);eye.position.set(x,1.94,.285);avatar.add(eye)}
const arms=[],legs=[];
for(let x of [-.48,.48]){let arm=addBox(avatar,x,1.08,0,.2,.72,.22,M.suit);arm.rotation.z=x<0?-.12:.12;arms.push(arm);let hand=new THREE.Mesh(new THREE.SphereGeometry(.12,10,8),M.skin);hand.position.set(x,.68,.02);avatar.add(hand)}
for(let x of [-.2,.2]){let leg=addBox(avatar,x,.38,0,.23,.7,.27,M.navy);legs.push(leg);addBox(avatar,x,.08,.1,.28,.14,.43,M.dark)}

let held=null,nearProp=null,actionUntil=0,shoutWave=null;
const keys={};let soundOn=false,audio=null;
function toast(s){let el=document.querySelector('#toast');el.textContent=s;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),1600)}
function initAudio(){if(!audio){audio=new (window.AudioContext||window.webkitAudioContext)()}if(audio.state==='suspended')audio.resume()}
function tone(freq,duration=.12,type='sine',gain=.08,slide=0){if(!soundOn)return;initAudio();let o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(freq,audio.currentTime);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,freq+slide),audio.currentTime+duration);g.gain.setValueAtTime(gain,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+duration)}
function noise(duration=.2,gain=.08){if(!soundOn)return;initAudio();let n=Math.floor(audio.sampleRate*duration),b=audio.createBuffer(1,n,audio.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);let s=audio.createBufferSource(),g=audio.createGain();s.buffer=b;g.gain.value=gain;s.connect(g).connect(audio.destination);s.start()}
function sfx(type){if(type==='pickup'){tone(420,.07,'triangle',.045,120)}if(type==='throw'){tone(500,.18,'sawtooth',.06,-350);setTimeout(()=>noise(.2,.07),80)}if(type==='hit'){tone(105,.16,'square',.09,-55);noise(.12,.05)}if(type==='kick'){tone(85,.14,'square',.1,-35);noise(.1,.06)}if(type==='shout'){tone(190,.45,'sawtooth',.07,500);noise(.38,.045)}}
function forward(){return new THREE.Vector3(Math.sin(avatar.rotation.y),0,Math.cos(avatar.rotation.y)).normalize()}
function nearestProp(){let best=null,dist=2.25;for(const p of props){if(p.userData.held)continue;let d=avatar.position.distanceTo(p.position);if(d<dist){dist=d;best=p}}return best}
function pickup(){if(held){throwHeld();return}nearProp=nearestProp();if(!nearProp){toast('가까이에 집을 수 있는 물건이 없어요');return}held=nearProp;held.userData.held=true;sfx('pickup');toast(held.userData.name+'을(를) 들었어요 · 클릭 또는 E로 던지기')}
function throwHeld(){if(!held)return;let p=held;p.userData.held=false;p.position.copy(avatar.position).add(forward().multiplyScalar(1.05));p.position.y=.55;p.userData.velocity.copy(forward().multiplyScalar(10)).add(new THREE.Vector3(0,4,0));p.userData.spin.set(5,7,3);held=null;sfx('throw');toast('휙! 시원하게 던졌어요')}
function kick(){let f=forward(),hit=null,dist=2;for(let p of props){if(p.userData.held)continue;let d=avatar.position.distanceTo(p.position);if(d<dist&&p.position.clone().sub(avatar.position).normalize().dot(f)>.15){hit=p;dist=d}}if(hit){hit.userData.velocity.add(f.clone().multiplyScalar(9).add(new THREE.Vector3(0,2,0)));hit.userData.spin.set(8,5,4);sfx('kick');toast('퍽! '+hit.userData.name+'을(를) 걷어찼어요')}else{sfx('kick');toast('휙! 발차기')};actionUntil=performance.now()+320;legs[0].rotation.x=-.9}
function shout(){sfx('shout');toast('아아아아악!!! 오늘 스트레스 여기 두고 간다!!!');let ring=new THREE.Mesh(new THREE.RingGeometry(.5,.68,48),new THREE.MeshBasicMaterial({color:0xffd36c,transparent:true,opacity:.9,side:THREE.DoubleSide}));ring.rotation.x=-Math.PI/2;ring.position.set(avatar.position.x,.12,avatar.position.z);scene.add(ring);let start=performance.now();function pulse(){let t=(performance.now()-start)/650;ring.scale.setScalar(1+t*7);ring.material.opacity=Math.max(0,1-t);if(t<1)requestAnimationFrame(pulse);else{scene.remove(ring);ring.geometry.dispose();ring.material.dispose()}}pulse();actionUntil=performance.now()+500}
function act(){if(held)throwHeld();else pickup()}
addEventListener('keydown',e=>{let k=e.key.toLowerCase();if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(k))e.preventDefault();if(!keys[k]){if(k==='e')act();if(k===' ')kick();if(k==='q')shout()}keys[k]=true});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
// Mobile analog joystick: pointer capture keeps movement smooth even if the thumb drifts.
const joystick=document.querySelector('#mobile'),stick=document.querySelector('#stick');
const joy={x:0,y:0,pointer:null};
function updateJoy(e){
  const r=joystick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
  const max=r.width*.34,dx=e.clientX-cx,dy=e.clientY-cy,len=Math.hypot(dx,dy),scale=len>max?max/len:1;
  joy.x=dx*scale/max;joy.y=dy*scale/max;
  stick.style.left=`calc(50% + ${joy.x*max}px)`;stick.style.top=`calc(50% + ${joy.y*max}px)`;
}
function resetJoy(){joy.x=0;joy.y=0;joy.pointer=null;stick.style.left='50%';stick.style.top='50%'}
joystick.addEventListener('pointerdown',e=>{e.preventDefault();joy.pointer=e.pointerId;joystick.setPointerCapture(e.pointerId);updateJoy(e)});
joystick.addEventListener('pointermove',e=>{if(joy.pointer===e.pointerId){e.preventDefault();updateJoy(e)}});
['pointerup','pointercancel','lostpointercapture'].forEach(ev=>joystick.addEventListener(ev,resetJoy));

// Right-side camera wheel: drag left/right to orbit and up/down to tilt the view.
const cameraWheel=document.querySelector('#cameraWheel'),cameraStick=document.querySelector('#cameraStick');
const camTouch={x:0,y:0,pointer:null};let cameraYaw=.675,cameraPitch=.58;
function updateCameraWheel(e){
  const r=cameraWheel.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
  const max=r.width*.32,dx=e.clientX-cx,dy=e.clientY-cy,len=Math.hypot(dx,dy),scale=len>max?max/len:1;
  camTouch.x=dx*scale/max;camTouch.y=dy*scale/max;
  cameraStick.style.left=`calc(50% + ${camTouch.x*max}px)`;cameraStick.style.top=`calc(50% + ${camTouch.y*max}px)`;
}
function resetCameraWheel(){camTouch.x=0;camTouch.y=0;camTouch.pointer=null;cameraStick.style.left='50%';cameraStick.style.top='50%'}
cameraWheel.addEventListener('pointerdown',e=>{e.preventDefault();camTouch.pointer=e.pointerId;cameraWheel.setPointerCapture(e.pointerId);updateCameraWheel(e)});
cameraWheel.addEventListener('pointermove',e=>{if(camTouch.pointer===e.pointerId){e.preventDefault();updateCameraWheel(e)}});
['pointerup','pointercancel','lostpointercapture'].forEach(ev=>cameraWheel.addEventListener(ev,resetCameraWheel));
document.querySelector('#sound').onclick=()=>{soundOn=!soundOn;if(soundOn){initAudio();tone(660,.08,'sine',.04)}document.querySelector('#sound').textContent=soundOn?'♫ 사운드 켜짐':'♫ 사운드 켜기';toast(soundOn?'효과음을 켰어요':'효과음을 껐어요')};
document.querySelector('#pickupBtn').onclick=act;document.querySelector('#kickBtn').onclick=kick;document.querySelector('#shoutBtn').onclick=shout;
function bindTouchAction(id,fn){const el=document.querySelector(id);el.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();fn()});}
bindTouchAction('#mPickup',act);bindTouchAction('#mKick',kick);bindTouchAction('#mShout',shout);
renderer.domElement.addEventListener('pointerdown',e=>{if(held&&e.pointerType==='mouse')throwHeld()});
const clock=new THREE.Clock(),look=new THREE.Vector3();
function animate(){requestAnimationFrame(animate);let dt=Math.min(clock.getDelta(),.04),moving=false;
let f=(keys.w||keys.arrowup?1:0)-(keys.s||keys.arrowdown?1:0)-joy.y;
let side=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0)+joy.x;
if(f||side){let v=new THREE.Vector3(side,0,-f).normalize();avatar.position.addScaledVector(v,5*dt);avatar.position.x=THREE.MathUtils.clamp(avatar.position.x,-15,15);avatar.position.z=THREE.MathUtils.clamp(avatar.position.z,-11,11);avatar.rotation.y=Math.atan2(v.x,v.z);moving=true}
let t=performance.now()*.01;if(moving){legs[0].rotation.x=Math.sin(t)*.55;legs[1].rotation.x=-Math.sin(t)*.55;arms[0].rotation.x=-Math.sin(t)*.35;arms[1].rotation.x=Math.sin(t)*.35;torso.position.y=1.08+Math.abs(Math.sin(t))*.035}else if(performance.now()>actionUntil){legs.forEach(l=>l.rotation.x=0);arms.forEach(a=>a.rotation.x=0);torso.position.y=1.08}
if(held){held.position.copy(avatar.position).add(forward().multiplyScalar(.85));held.position.y=1.35;held.rotation.set(0,avatar.rotation.y,0)}
for(const p of props){if(p.userData.held)continue;let v=p.userData.velocity;if(v.lengthSq()>.01){p.position.addScaledVector(v,dt);v.y-=12*dt;p.rotation.x+=p.userData.spin.x*dt;p.rotation.y+=p.userData.spin.y*dt;p.rotation.z+=p.userData.spin.z*dt;if(p.position.y<.25){p.position.y=.25;v.y=Math.abs(v.y)*.32;v.x*=.72;v.z*=.72;p.userData.spin.multiplyScalar(.65);if(v.length()>1.5){sfx('hit');p.userData.velocity.multiplyScalar(.72)}}if(p.position.y<.27&&v.length()<.7){v.set(0,0,0);p.userData.spin.set(0,0,0)}p.position.x=THREE.MathUtils.clamp(p.position.x,-16,16);p.position.z=THREE.MathUtils.clamp(p.position.z,-12,12)}}
nearProp=nearestProp();document.querySelector('#status').textContent=held?'✋ '+held.userData.name+' 들고 있음':nearProp?'E · '+nearProp.userData.name+' 집기':'🏢 오피스 · 자유 행동';
look.set(avatar.position.x,1.15,avatar.position.z);cameraYaw-=camTouch.x*dt*2.25;
cameraPitch=THREE.MathUtils.clamp(cameraPitch+camTouch.y*dt*1.55,.18,1.18);
const camDistance=13.2,horizontal=Math.cos(cameraPitch)*camDistance;
let desired=new THREE.Vector3(
 avatar.position.x+Math.sin(cameraYaw)*horizontal,
 avatar.position.y+Math.sin(cameraPitch)*camDistance+1.2,
 avatar.position.z+Math.cos(cameraYaw)*horizontal
);
camera.position.lerp(desired,1-Math.pow(.001,dt));camera.lookAt(look);renderer.render(scene,camera)}
animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.fov=innerWidth<700?62:52;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
</body></html>
