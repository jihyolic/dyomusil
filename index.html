<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
    />
    <title>됴무실 — Office Stress Break</title>
    <meta
      name="description"
      content="직장 스트레스를 게임 속에서 마음껏 해소하는 됴무실"
    />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@500;700;800&display=swap");
      :root {
        --ink: #25313d;
        --glass: rgba(255, 255, 255, 0.9);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: "Noto Sans KR", sans-serif;
        background: #9eb4bd;
        color: var(--ink);
        -webkit-user-select: none;
        user-select: none;
      }
      canvas {
        display: block;
        touch-action: none;
      }
      .top {
        position: fixed;
        left: 18px;
        top: 14px;
        z-index: 3;
        color: #fff;
        text-shadow:
          0 2px 0 #b3392c,
          0 3px 12px #182b36;
      }
      .brand {
        font:
          400 30px "Black Han Sans",
          sans-serif;
        letter-spacing: 3px;
      }
      .tag {
        font-size: 11px;
        font-weight: 700;
      }
      .hud {
        position: fixed;
        right: 14px;
        top: 14px;
        z-index: 3;
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .pill,
      .help {
        border: 1px solid #fffa;
        background: var(--glass);
        border-radius: 99px;
        padding: 8px 13px;
        font:
          700 12px "Noto Sans KR",
          sans-serif;
        color: #304b55;
        box-shadow: 0 5px 20px #172b3622;
      }
      .help {
        position: fixed;
        left: 14px;
        bottom: 14px;
        z-index: 3;
        line-height: 1.85;
        border-radius: 14px;
        font-weight: 500;
      }
      #gauge {
        position: fixed;
        left: 18px;
        top: 62px;
        z-index: 3;
        width: 240px;
        background: var(--glass);
        border-radius: 14px;
        padding: 8px 11px;
        font-size: 12px;
        font-weight: 800;
        box-shadow: 0 5px 20px #172b3622;
      }
      #bar {
        height: 12px;
        border-radius: 9px;
        background: #d7dfdc;
        margin-top: 5px;
        overflow: hidden;
      }
      #fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #e4573d, #f2a33a);
        transition: width 0.25s;
      }
      #toast {
        position: fixed;
        left: 50%;
        bottom: 28px;
        transform: translateX(-50%);
        z-index: 8;
        background: #203541ee;
        color: #fff;
        padding: 11px 18px;
        border-radius: 30px;
        font-size: 13px;
        font-weight: 700;
        opacity: 0;
        transition: 0.2s;
        pointer-events: none;
        white-space: nowrap;
      }
      #toast.show {
        opacity: 1;
        bottom: 40px;
      }
      #actionbar {
        position: fixed;
        right: 18px;
        bottom: 18px;
        z-index: 4;
        display: flex;
        gap: 8px;
      }
      .action {
        border: 1px solid #fff9;
        background: #fffbf0ee;
        color: #29424b;
        border-radius: 13px;
        padding: 12px 15px;
        font:
          800 12px "Noto Sans KR",
          sans-serif;
        cursor: pointer;
      }
      .action:active {
        transform: scale(0.95);
      }
      #fx {
        position: fixed;
        inset: 0;
        z-index: 7;
        pointer-events: none;
        overflow: hidden;
      }
      .pop {
        position: absolute;
        font:
          400 34px "Black Han Sans",
          sans-serif;
        color: #fff;
        transform: translate(-50%, -50%) rotate(-7deg);
        -webkit-text-stroke: 6px #c0392b;
        paint-order: stroke fill;
        animation: pop 0.9s ease-out forwards;
        white-space: nowrap;
      }
      @keyframes pop {
        0% {
          transform: translate(-50%, -30%) rotate(-7deg) scale(0.3);
          opacity: 0;
        }
        15% {
          transform: translate(-50%, -60%) rotate(-7deg) scale(1.25);
          opacity: 1;
        }
        100% {
          transform: translate(-50%, -150%) rotate(-7deg) scale(1);
          opacity: 0;
        }
      }
      #flash {
        position: fixed;
        inset: 0;
        z-index: 6;
        background: #fff;
        opacity: 0;
        pointer-events: none;
      }
      #mobile {
        display: none;
        position: fixed;
        left: 14px;
        bottom: max(16px, env(safe-area-inset-bottom));
        z-index: 5;
        width: 124px;
        height: 124px;
        border-radius: 50%;
        background: #eaf2edb8;
        border: 2px solid #ffffffd9;
        touch-action: none;
      }
      #stick {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 52px;
        height: 52px;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        background: linear-gradient(145deg, #fff, #cbd9d4);
        box-shadow: 0 4px 12px #1d344044;
        pointer-events: none;
      }
      #mobileActions {
        display: none;
        position: fixed;
        right: 12px;
        bottom: max(12px, env(safe-area-inset-bottom));
        z-index: 6;
        gap: 6px;
        flex-wrap: wrap;
        justify-content: flex-end;
        width: 156px;
      }
      #mobileActions button {
        width: 74px;
        min-height: 54px;
        border: 1px solid #fffe;
        background: #fffbf0f2;
        border-radius: 16px;
        font:
          800 12px "Noto Sans KR",
          sans-serif;
        color: #29424b;
        touch-action: manipulation;
      }
      #mobileActions button:active {
        transform: scale(0.94);
        background: #dce9e2;
      }
      @media (max-width: 700px) {
        .brand {
          font-size: 21px;
        }
        .tag {
          font-size: 8px;
        }
        .top {
          left: 10px;
          top: 8px;
        }
        .hud {
          right: 7px;
          top: 7px;
        }
        .pill {
          padding: 6px 8px;
          font-size: 9px;
        }
        #gauge {
          left: 10px;
          top: 48px;
          width: 150px;
        }
        .help,
        #actionbar {
          display: none;
        }
        #mobile {
          display: block;
        }
        #mobileActions {
          display: flex;
        }
        .pop {
          font-size: 26px;
        }
      }
      @media (max-width: 700px) {
        .hud {
          flex-wrap: wrap;
          justify-content: flex-end;
          max-width: 64vw;
        }
      }
      .tog {
        min-width: 104px;
        background: #d9dedd;
        color: #6b7b82;
        border-color: #fff8;
      }
      .tog.on {
        background: #2f9e6a;
        color: #fff;
        border-color: #2f9e6a;
        box-shadow:
          0 0 0 3px #2f9e6a33,
          0 5px 20px #172b3622;
      }
      #rkhud {
        display: none;
        position: fixed;
        top: 12px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 5;
        gap: 16px;
        align-items: center;
        background: #203541ee;
        color: #fff;
        border-radius: 18px;
        padding: 8px 20px;
        font-weight: 800;
        font-size: 22px;
        white-space: nowrap;
      }
      #rkTime.warn {
        color: #ff7a6a;
      }
      #cd {
        display: none;
        position: fixed;
        left: 0;
        right: 0;
        top: 32%;
        z-index: 35;
        text-align: center;
        font:
          400 110px "Black Han Sans",
          sans-serif;
        color: #fff;
        -webkit-text-stroke: 8px #c0392b;
        paint-order: stroke fill;
        pointer-events: none;
      }
      #modal {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 40;
        background: #10202a99;
        align-items: center;
        justify-content: center;
      }
      .mb {
        background: #fff;
        border-radius: 20px;
        padding: 22px;
        width: min(92vw, 380px);
        max-height: 90vh;
        overflow: auto;
        text-align: center;
        box-shadow: 0 20px 60px #0008;
        font-weight: 700;
      }
      .mb h2 {
        margin: 0 0 8px;
        font-size: 22px;
      }
      .mb p {
        margin: 6px 0;
      }
      .dim {
        color: #6b7b82;
        font-size: 12px;
        font-weight: 600;
      }
      .mb input {
        width: 100%;
        padding: 11px;
        border: 2px solid #cfd8d6;
        border-radius: 12px;
        font: 700 16px inherit;
        text-align: center;
        margin: 8px 0;
      }
      .big {
        font:
          400 52px "Black Han Sans",
          sans-serif;
        color: #c0392b;
        margin: 4px 0;
      }
      .btns {
        display: flex;
        gap: 8px;
        margin-top: 12px;
      }
      .btns button {
        flex: 1;
        border: 0;
        border-radius: 12px;
        padding: 12px;
        font: 800 14px inherit;
        background: #2f9e6a;
        color: #fff;
        cursor: pointer;
      }
      .btns button.sub {
        background: #d9dedd;
        color: #44545b;
      }
      .bt {
        width: 100%;
        border-collapse: collapse;
        margin-top: 8px;
        font-size: 14px;
      }
      .bt td {
        padding: 6px 8px;
        border-bottom: 1px solid #eef1f0;
      }
      .bt td:first-child {
        width: 36px;
      }
      .bt td:last-child {
        text-align: right;
        font-weight: 800;
      }
      .bt tr.me {
        background: #fff3c9;
      }
    </style>
    <!-- 됴무실 앱 아이콘 -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- 브라우저 아이콘 -->
    <link rel="icon" type="image/png" href="/apple-touch-icon.png" />

    <!-- iPhone 웹 앱 설정 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="됴무실" />
    <meta name="mobile-web-app-capable" content="yes" />
  </head>
  <body>
    <div id="world"></div>
    <div class="top">
      <div class="brand">됴무실</div>
      <div class="tag">
        OFFICE STRESS BREAK · 오늘의 스트레스는 여기에 두고 가요
      </div>
    </div>
    <div id="gauge">
      <span>😤 스트레스 <span id="pct">100</span>%</span> ·
      <span>💥 파괴 <span id="score">0</span>/1000</span>
      <div id="bar"><div id="fill"></div></div>
    </div>
    <div class="hud">
      <button class="pill" id="rankBtn">🏆 랭크전</button
      ><button class="pill" id="boardBtn">📊 랭킹</button>
      <button class="pill tog" id="sound">🔇 효과음 OFF</button>
    </div>
    <div class="help">
      이동 <b>방향키</b><br />집기·던지기 <b>E</b> / 클릭 (책상·의자·화분도
      OK)<br />발차기 <b>Space</b> · 주먹 <b>F</b><br />고함 <b>D</b> · 욕하기
      <b>S</b> · 서류 폭죽 <b>A</b><br />벽을 계속 치면 금이 가다 무너져요<br />상사들은
      가까이 가면 도망가요 — 쫓아가서 혼내주세요!<br />드래그로 시점 회전
    </div>
    <div id="actionbar">
      <button class="action" id="pickupBtn">E 집기·던지기</button
      ><button class="action" id="kickBtn">SPACE 발차기</button
      ><button class="action" id="shoutBtn">D 고함</button
      ><button class="action" id="curseBtn">S 욕하기</button
      ><button class="action" id="punchBtn">F 주먹</button
      ><button class="action" id="rainBtn">A 서류 폭죽</button>
    </div>
    <div id="mobile"><div id="stick"></div></div>
    <div id="mobileActions">
      <button id="mPickup">✋<br />집기·던지기</button
      ><button id="mKick">👟<br />발차기</button
      ><button id="mShout">📢 D<br />고함</button
      ><button id="mCurse">🤬 S<br />욕하기</button
      ><button id="mPunch">👊<br />주먹</button
      ><button id="mRain">🎉 A<br />서류 폭죽</button>
    </div>
    <div id="rkhud">
      ⏱ <span id="rkTime">30.0</span><span>💥 <span id="rkScore">0</span></span>
    </div>
    <div id="cd"></div>
    <div id="modal"></div>
    <div id="fx"></div>
    <div id="flash"></div>
    <div id="toast"></div>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
        }
      }
    </script>
    <script type="module">
      import * as THREE from "three";
      const $ = (s) => document.querySelector(s),
        R = Math.random,
        V = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);
      const MODE = "office";
      const scene = new THREE.Scene();
      const BGC = 0x9eb4bd;
      scene.background = new THREE.Color(BGC);
      scene.fog = new THREE.Fog(BGC, 28, 66);
      const camera = new THREE.PerspectiveCamera(
        innerWidth < 700 ? 62 : 52,
        innerWidth / innerHeight,
        0.1,
        120,
      );
      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.setSize(innerWidth, innerHeight);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.12;
      $("#world").appendChild(renderer.domElement);
      scene.add(new THREE.HemisphereLight(0xeaf4ff, 0x6e777c, 2.1));
      const sun = new THREE.DirectionalLight(0xffedcf, 2.6);
      sun.position.set(-8, 15, 10);
      sun.castShadow = true;
      sun.shadow.mapSize.set(2048, 2048);
      Object.assign(sun.shadow.camera, {
        left: -20,
        right: 20,
        top: 20,
        bottom: -20,
      });
      scene.add(sun);
      const mat = (c, r = 0.8, m = 0) =>
        new THREE.MeshStandardMaterial({
          color: c,
          roughness: r,
          metalness: m,
        });
      const M = {
        floor: mat(0x9ba7a6),
        wall: mat(0xd9dedb),
        blue: mat(0x607d8b),
        navy: mat(0x263d50),
        suit: mat(0x26394c),
        shirt: mat(0xf3f0e7),
        tie: mat(0xc0483c),
        skin: mat(0xe6b994),
        hair: mat(0x342d2b),
        wood: mat(0x9a795c),
        dark: mat(0x303b42),
        screen: mat(0x5aa3b5, 0.3),
        red: mat(0xb45c50),
        green: mat(0x5e806b),
        paper: mat(0xf1eee2),
        metal: mat(0x68777d, 0.35, 0.45),
        glass: mat(0x9dbdca, 0.3),
      };
      function box(p, x, y, z, sx, sy, sz, m) {
        const o = new THREE.Mesh(new THREE.BoxGeometry(sx, sy, sz), m);
        o.position.set(x, y, z);
        o.castShadow = true;
        o.receiveShadow = true;
        p.add(o);
        return o;
      }
      function cyl(p, x, y, z, rt, rb, h, m) {
        const o = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, 12), m);
        o.position.set(x, y, z);
        o.castShadow = true;
        p.add(o);
        return o;
      }
      let spots = [],
        furn = [];
      function loc(x, z, t, lx, lz) {
        return [
          x + lx * Math.cos(t) + lz * Math.sin(t),
          z - lx * Math.sin(t) + lz * Math.cos(t),
        ];
      }
      function buildOffice() {
        // ---- office shell
        box(scene, 0, -0.2, 0, 34, 0.4, 28, M.floor);
        box(scene, 0, 4, -14, 34, 8, 0.35, M.wall);
        box(scene, -17, 4, 0, 0.35, 8, 28, M.wall);
        box(scene, 17, 4, 0, 0.35, 8, 28, M.wall);
        for (const x of [-11, -5, 1, 7, 13])
          box(scene, x, 4.1, -13.78, 4.7, 3.1, 0.08, M.glass);
        box(scene, 0, 3.4, -13.7, 5, 2.1, 0.1, M.paper);
        box(scene, 1, 0.95, -5, 8, 0.22, 2.5, M.wood);
        for (const x of [-2, 0, 2, 4])
          for (const z of [-7.1, -2.9])
            box(scene, x, 0.55, z, 1.1, 0.75, 0.85, M.blue);
        function workstation(x, z, t) {
          const g = new THREE.Group();
          g.position.set(x, 0, z);
          g.rotation.y = t;
          g.userData.label = "책상";
          scene.add(g);
          box(g, 0, 0.88, 0, 2.55, 0.16, 1.25, M.wood);
          box(g, 0, 0.48, -0.52, 2.35, 0.62, 0.09, M.blue);
          box(g, 0, 1.32, -0.98, 2.55, 0.72, 0.1, M.blue);
          for (const dx of [-1.08, 1.08])
            for (const dz of [-0.45, 0.45])
              box(g, dx, 0.43, dz, 0.09, 0.84, 0.09, M.metal);
          box(g, -1.0, 0.3, -0.15, 0.34, 0.58, 0.6, M.dark);
          box(g, -1.0, 0.35, 0.16, 0.2, 0.04, 0.02, M.screen);
          cyl(g, -0.72, 1.07, -0.42, 0.09, 0.1, 0.2, M.dark);
          [M.red, M.blue, M.green, M.tie].forEach((m, i) => {
            const pn = cyl(
              g,
              -0.74 + i * 0.04,
              1.25,
              -0.42,
              0.012,
              0.012,
              0.26,
              m,
            );
            pn.rotation.z = (i - 1.5) * 0.12;
          });
          box(g, 0.8, 1.0, -0.42, 0.3, 0.08, 0.22, M.dark);
          box(g, 0.8, 1.045, -0.38, 0.18, 0.02, 0.1, M.screen);
          [
            [0.36, 1.36, 0xe7d58b],
            [0.52, 1.28, 0xf2a3b3],
            [0.3, 1.2, 0x9fd3a6],
          ].forEach(([x, y, c]) => {
            const n = box(g, x, y, -0.28, 0.11, 0.11, 0.01, mat(c));
            n.rotation.z = (x - 0.4) * 1.5;
          });
          box(g, 0.62, 0.97, 0.14, 0.3, 0.012, 0.26, M.navy);
          for (let n = 0; n < 3; n++) {
            const sh = box(
              g,
              -0.1 + n * 0.16,
              0.97,
              0.5,
              0.4,
              0.012,
              0.3,
              M.paper,
            );
            sh.rotation.y = (n - 1) * 0.14;
          }
          cyl(g, 1.1, 1.1, -0.42, 0.11, 0.12, 0.2, M.red);
          cyl(g, 1.1, 1.28, -0.42, 0.06, 0.06, 0.22, M.green);
          spots.push({ x, z, t });
        }
        [
          [-6, -8, 0],
          [0, -8, 0],
          [6, -8, 0],
          [-6, 5, Math.PI],
          [0, 5, Math.PI],
          [6, 5, Math.PI],
          [-12, -1, 0],
          [-6, -1, 0],
          [0, -1, 0],
          [6, -1, 0],
          [12, -1, 0],
          [-12, 9, Math.PI],
          [-6, 9, Math.PI],
          [0, 9, Math.PI],
          [6, 9, Math.PI],
          [12, 9, Math.PI],
        ].forEach((a) => workstation(...a));
        function plant(x, z) {
          const G = new THREE.Group();
          G.userData.label = "화분";
          scene.add(G);
          cyl(G, x, 0.45, z, 0.25, 0.34, 0.9, M.wood);
          for (let i = 0; i < 7; i++) {
            const a = (i * Math.PI * 2) / 7,
              l = new THREE.Mesh(
                new THREE.SphereGeometry(0.35, 10, 8),
                M.green,
              );
            l.position.set(
              x + Math.cos(a) * 0.35,
              1.35 + (i % 2) * 0.15,
              z + Math.sin(a) * 0.35,
            );
            l.scale.set(0.6, 1.5, 0.55);
            G.add(l);
          }
        }
        plant(-14, -11);
        plant(14, -11);
        plant(-14, 11);
        plant(14, 11);
        for (const z of [-4, 0])
          for (const x of [-15, 15])
            box(scene, x, 1, z, 1.05, 2, 0.85, M.metal);
        const stripes = new THREE.Group();
        stripes.userData.keep = true;
        scene.add(stripes);
        for (let i = -7; i < 7; i++)
          box(
            stripes,
            0,
            0.02,
            i * 2 + 1,
            34,
            0.03,
            1,
            mat(i % 2 ? 0x94a2a1 : 0xa2aeac),
          );
        [
          [-9, 4.6, 0xe4573d],
          [9, 4.6, 0x4a8f8c],
          [-14, 5, 0xf2a33a],
        ].forEach(([x, y, c]) => {
          box(scene, x, y, -13.72, 2, 2.7, 0.05, mat(c));

          dy = e.clientY - r.top - r.height / 2,
          l = Math.hypot(dx, dy),
          s = l > max ? max / l : 1;
        joy.x = (dx * s) / max;
        joy.y = (dy * s) / max;
        stick.style.left = `calc(50% + ${joy.x * max}px)`;

      const RANK_API =

        return "서버 응답 오류: " + e.message;

                  : { method: "POST", body: JSON.stringify(body) },
              )
            : await fetch(RANK_API, {
                method,
                headers: { "Content-Type": "application/json" },
                body: body ? JSON.stringify(body) : undefined,
              });
          if (!r.ok) throw new Error("HTTP " + r.status);
          const j = await r.json();
          if (j.error) throw new Error(j.error);
          return j;
        } catch (e) {
          lastErr = diag(e);
          throw e;

            "</p>";
      async function openBoard() {
        showModal('<h2>🏆 랭킹</h2><p class="dim">불러오는 중...</p>');
        const r = await getBoard();
        showModal(
          "<h2>🏆 랭킹 TOP 10</h2>" +
            boardHTML(r.board, myName) +
            noteH(r.shared) +
            '<div class="btns"><button data-act="intro">랭크전 도전</button><button data-act="close" class="sub">닫기</button></div>',
        );
      }
      function openIntro() {
        if (RK.state === "play" || RK.state === "count") return;
        showModal(
          `<h2>🏆 랭크전</h2><p>제한시간 <b>30초</b> 동안<br>폭발지수를 최대한 올려보세요!<br><span class="dim">물건 부수기·동료 날리기·벽 부수기·폭발 보너스 모두 점수!<br>이름별 최고 기록이 랭킹에 남아요.</span></p><input id="nm" maxlength="10" placeholder="이름 (최대 10자)" value="${esc(myName)}"><div class="btns"><button data-act="start">시작!</button><button data-act="close" class="sub">취소</button></div>`,
        );
        setTimeout(() => {
          const i = $("#nm");
          if (i && i.focus) i.focus();
        }, 50);
      }
      function doStart() {
        const v = (($("#nm") || {}).value || myName || "").trim();
        if (!v) return toast("이름을 입력해 주세요");
        if (boom) return toast("폭발 복구 중이에요. 잠시 후 시작해 주세요");
        startRank(v);
      }
      function resetWorld() {
        if (held) {
          held.userData.held = false;
          held = null;
        }
        for (const k in cdT) delete cdT[k]; // 쿨타임 초기화
        for (const p of props) {
          const d = p.userData;
          d.held = false;
          d.dead = false;
          d.soft = 0;
          d.v.set(0, 0, 0);
          d.spin.set(0, 0, 0);
          p.visible = true;
          p.position.copy(d.home);
          if (d.hr) p.rotation.copy(d.hr);
          else p.rotation.set(0, d.homeR || 0, 0);
        }
        for (const o of furn) {
          const d = o.userData;
          d.fly = false;
          if (d.hp) {
            o.position.copy(d.hp);
            o.rotation.copy(d.hr);
          }
        }
        for (const n of npcs) {
          const d = n.userData;
          d.v.set(0, 0, 0);
          d.down = 0;
          n.position.copy(d.home);
          n.rotation.set(0, d.ry, 0);
        }
        for (const w of walls) {
          w.broken = false;
          w.hp = 0;
          w.m.visible = true;
          w.parts.forEach((o) => (o.visible = true));
          w.m.material.color.copy(w.base);
          w.cr.forEach((c) => crackG.remove(c));
          w.cr = [];
        }
        score = 0;
        stress = 100;
        $("#score").textContent = 0;
        $("#pct").textContent = 100;
        $("#fill").style.width = "0%";
        avatar.position.set(0, 0, 2);
      }
      function startRank(name) {
        myName = name;
        try {
          localStorage.setItem("dmoo_name", name);
        } catch (e) {}
        closeModal();
        resetWorld();
        RK.state = "count";
        RK.score = 0;
        updRank();
        $("#rkhud").style.display = "flex";
        $("#rkTime").textContent = "30.0";
        const cd = $("#cd");
        cd.style.display = "block";
        [3, 2, 1, "START!"].forEach((t, i) =>
          setTimeout(() => {
            cd.textContent = t;
            ts(i < 3 ? 660 : 1000, 0.15, { type: "square", g: 0.1, wet: 0.1 });
            if (i === 3) {
              RK.state = "play";
              RK.end = performance.now() + 30000;
              setTimeout(() => {
                cd.style.display = "none";
              }, 700);
            }
          }, i * 900),
        );
      }
      async function finishRank() {
        RK.state = "over";
        $("#rkhud").style.display = "none";
        sfx.alarm();
        flash(0.5);
        const sc = RK.score;
        showModal(
          `<h2>⏰ TIME UP!</h2><div class="big">${fmt(sc)}</div><p class="dim">기록 저장 중...</p>`,
        );
        const r = await submitScore(myName, sc);
        showModal(
          `<h2>⏰ TIME UP!</h2><div class="big">💥 ${fmt(sc)}</div><p>${esc(myName)}님 현재 <b>${r.rank}위</b>${r.best > sc ? ' <span class="dim">(내 최고 ' + fmt(r.best) + ")</span>" : ""}</p>` +
            boardHTML(r.board, myName) +
            noteH(r.shared) +
            '<div class="btns"><button data-act="again">다시 도전</button><button data-act="close" class="sub">닫기</button></div>',
        );
      }
      $("#modal").addEventListener("click", (e) => {
        const a = e.target && e.target.dataset && e.target.dataset.act;
        if (a === "start") doStart();
        else if (a === "again") doStart();
        else if (a === "intro") openIntro();
        else if (a === "close") {
          closeModal();
          if (RK.state === "over") RK.state = "idle";
        }
      });
      $("#modal").addEventListener("keydown", (e) => {
        if (e.key === "Enter" && e.target && e.target.id === "nm") doStart();
      });
      $("#rankBtn").onclick = openIntro;
      $("#boardBtn").onclick = openBoard;
      const clock = new THREE.Clock(),
        look = V();
      function animate() {
        requestAnimationFrame(animate);
        const dt = Math.min(clock.getDelta(), 0.04),
          now = performance.now();
        let moving = false;
        const f = (keys.arrowup ? 1 : 0) - (keys.arrowdown ? 1 : 0) - joy.y,
          sd = (keys.arrowright ? 1 : 0) - (keys.arrowleft ? 1 : 0) + joy.x;
        if (sd) avatar.rotation.y -= sd * 2.8 * dt;
        if (f || sd) {
          if (f) {
            avatar.position.addScaledVector(
              fwd(),
              THREE.MathUtils.clamp(f, -1, 1) * BAL.moveSpeed * dt,
            );
            avatar.position.x = THREE.MathUtils.clamp(
              avatar.position.x,
              -16.1,
              16.1,
            );
            avatar.position.z = THREE.MathUtils.clamp(
              avatar.position.z,
              -13,
              12,
            );
          }
          moving = true;
        }
        const t = now * 0.012;
        if (moving && now > actionUntil) {
          legs[0].rotation.x = Math.sin(t) * 0.55;
          legs[1].rotation.x = -Math.sin(t) * 0.55;
          if (!held) {
            arms[0].rotation.x = -Math.sin(t) * 0.35;
            arms[1].rotation.x = Math.sin(t) * 0.35;
          }
          torso.position.y = 1.08 + Math.abs(Math.sin(t)) * 0.035;
        } else if (now > actionUntil) {
          legs.forEach((l) => (l.rotation.x = 0));
          if (!held) arms.forEach((a) => (a.rotation.x = 0));
          torso.position.y = 1.08;
        }
        if (held) {
          held.position
            .copy(avatar.position)
            .add(fwd().multiplyScalar(0.9 + (held.userData.rad || 0) * 0.7));
          held.position.y = 1.3 + (held.userData.fy || 0);
          held.rotation.set(0, avatar.rotation.y, 0);
          arms.forEach((a) => (a.rotation.x = -2.2));
        }
        for (const p of props) {
          const d = p.userData;
          if (d.dead) {
            if (now > d.t) {
              d.dead = false;
              p.visible = true;
              p.position.copy(d.home);
              if (d.hr) p.rotation.copy(d.hr);
              else p.rotation.set(0, d.homeR, 0);
              d.v.set(0, 0, 0);
            }
            continue;
          }
          if (d.held) continue;
          const v = d.v;
          if (v.lengthSq() > 0.01) {
            p.position.addScaledVector(v, dt);
            v.y -= 14 * dt;
            p.rotation.x += d.spin.x * dt;
            p.rotation.y += d.spin.y * dt;
            p.rotation.z += d.spin.z * dt;
            const sp = v.length();
            for (const n of npcs) {
              if (n.userData.down > now) continue;
              const dx = n.position.x - p.position.x,
                dz = n.position.z - p.position.z;
              if (
                dx * dx + dz * dz < 0.8 + (d.rad || 0) * (d.rad || 0) * 0.5 &&
                p.position.y < 2.4 &&
                sp > 4
              ) {
                knock(n, v.clone().setY(0).normalize(), sp * 0.6, "아야악!!!");
                v.multiplyScalar(-0.3);
                d.spin.multiplyScalar(0.5);
              }
            }
            const fy = d.fy || 0;
            if (p.position.y < fy) {
              p.position.y = fy;
              if (sp > (d.furn ? 5 : 8)) smash(p, sp > (d.furn ? 10 : 14));
              else {
                v.y = Math.abs(v.y) * 0.3;
                v.x *= 0.7;
                v.z *= 0.7;
                d.spin.multiplyScalar(0.6);
                if (sp > 2.5) sfx.hit();
              }
            }
            const bx = THREE.MathUtils.clamp(p.position.x, -16.2, 16.2),
              bz = THREE.MathUtils.clamp(p.position.z, -12.8, 12.8);
            if (bx !== p.position.x || bz !== p.position.z) {
              p.position.x = bx;
              p.position.z = bz;
              if (sp > 7) smash(p, true);
              else {
                v.x *= -0.4;
                v.z *= -0.4;
              }
            }
            if (
              !d.dead &&
              p.position.y < (d.fy || 0) + 0.05 &&
              v.length() < 0.8
            ) {
              v.set(0, 0, 0);
              d.spin.set(0, 0, 0);
              p.rotation.x = 0;
              p.rotation.z = 0;
            }
          }
        }
        for (const n of npcs) {
          const d = n.userData;
          setFace(
            n,
            d.down > now || d.v.lengthSq() > 0.05 || d.flee ? "hurt" : "normal",
          );
          if (d.down > now || d.v.lengthSq() > 0.05) {
            n.position.addScaledVector(d.v, dt);
            d.v.y -= 14 * dt;
            if (n.position.y < 0) {
              n.position.y = 0;
              d.v.x *= 0.8;
              d.v.z *= 0.8;
              d.v.y = 0;
            }
            n.position.x = THREE.MathUtils.clamp(n.position.x, -16, 16);
            n.position.z = THREE.MathUtils.clamp(n.position.z, -12.5, 12.5);
            n.rotation.x = THREE.MathUtils.lerp(n.rotation.x, -1.45, 0.2);
          } else {
            n.rotation.x = THREE.MathUtils.lerp(n.rotation.x, 0, 0.12);
            npcAI(n, d, now, dt);
          }
        }
        for (let i = debris.length - 1; i >= 0; i--) {
          const m = debris[i],
            d = m.userData;
          d.life -= dt;
          if (d.flutter !== undefined) {
            m.position.x += Math.sin(now * 0.003 + d.flutter) * dt * 1.2;
            m.rotation.x += dt * 2;
            m.rotation.z += dt * 1.5;
            m.position.addScaledVector(d.v, dt);
            if (m.position.y < 0.03) {
              m.position.y = 0.03;
              d.v.set(0, 0, 0);
            }
          } else {
            d.v.y -= 14 * dt;
            m.position.addScaledVector(d.v, dt);
            m.rotation.x += dt * 6;
            if (m.position.y < 0.05) {
              m.position.y = 0.05;
              d.v.multiplyScalar(0.5);
            }
          }
          if (d.life <= 0) {
            scene.remove(m);
            m.material.dispose();
            debris.splice(i, 1);
          }
        }
        for (const o of furn) {
          const d = o.userData;
          if (!d.fly) continue;
          o.position.addScaledVector(d.fv, dt);
          d.fv.y -= 16 * dt;
          o.rotation.x += d.fs.x * dt;
          o.rotation.y += d.fs.y * dt;
          o.rotation.z += d.fs.z * dt;
          const fl = d.hp.y > 1 ? 0.3 : 0;
          if (o.position.y < fl) {
            o.position.y = fl;
            d.fv.y = Math.abs(d.fv.y) * 0.3;
            d.fv.x *= 0.7;
            d.fv.z *= 0.7;
            d.fs.multiplyScalar(0.7);
            if (d.fv.lengthSq() < 0.6) {
              d.fv.set(0, 0, 0);
              d.fs.set(0, 0, 0);
            }
          }
          o.position.x = THREE.MathUtils.clamp(o.position.x, -16.5, 16.5);
          o.position.z = THREE.MathUtils.clamp(o.position.z, -13, 13);
        }
        for (let i = fires.length - 1; i >= 0; i--) {
          const m = fires[i],
            d = m.userData;
          d.t += dt;
          if (d.t < d.delay) continue;
          m.visible = true;
          const k = (d.t - d.delay) / d.life;
          m.scale.setScalar(0.3 + d.max * Math.min(1, k));
          m.material.opacity = Math.max(0, 0.9 * (1 - k));
          m.position.y += dt * 1.5;
          if (k >= 1) {
            scene.remove(m);
            m.material.dispose();
            fires.splice(i, 1);
          }
        }
        boomLight.intensity = Math.max(0, boomLight.intensity - dt * 500);
        rankTick(now);
        const camTarget = avatar.rotation.y + Math.PI;
        let camDiff = Math.atan2(
          Math.sin(camTarget - cameraYaw),
          Math.cos(camTarget - cameraYaw),
        );
        cameraYaw += camDiff * (1 - Math.pow(0.0005, dt));
        const near = nearest();
        look.set(avatar.position.x, 1.2, avatar.position.z);
        const dist = 10.5,
          h = Math.cos(cameraPitch) * dist,
          want = V(
            avatar.position.x + Math.sin(cameraYaw) * h,
            Math.sin(cameraPitch) * dist + 1,
            avatar.position.z + Math.cos(cameraYaw) * h,
          );
        camera.position.lerp(want, 1 - Math.pow(0.001, dt));
        if (shake > 0) {
          camera.position.add(
            V((R() - 0.5) * shake, (R() - 0.5) * shake, (R() - 0.5) * shake),
          );
          shake = Math.max(0, shake - dt * 2.2);
        }
        camera.lookAt(look);
        renderer.render(scene, camera);
      }
      animate();
      addEventListener("resize", () => {
        camera.aspect = innerWidth / innerHeight;
        camera.fov = innerWidth < 700 ? 62 : 52;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
      });
    </script>
  </body>
</html>
