<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
    />
    <title>됴무실 — Office Stress Break (Extreme Action Edition)</title>
    <meta
      name="description"
      content="직장 스트레스를 현란한 액션으로 마음껏 해소하는 됴무실"
    />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@500;700;800&display=swap");
      :root {
        --ink: #25313d;
        --glass: rgba(255, 255, 255, 0.9);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: "Noto Sans KR", sans-serif;
        background: #9eb4bd;
        color: var(--ink);
        -webkit-user-select: none;
        user-select: none;
      }
      canvas {
        display: block;
        touch-action: none;
      }
      .top {
        position: fixed;
        left: 18px;
        top: 14px;
        z-index: 3;
        color: #fff;
        text-shadow:
          0 2px 0 #b3392c,
          0 3px 12px #182b36;
      }
      .brand {
        font: 400 30px "Black Han Sans", sans-serif;
        letter-spacing: 3px;
      }
      .tag {
        font-size: 11px;
        font-weight: 700;
      }
      .hud {
        position: fixed;
        right: 14px;
        top: 14px;
        z-index: 3;
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .pill,
      .help {
        border: 1px solid #fffa;
        background: var(--glass);
        border-radius: 99px;
        padding: 8px 13px;
        font: 700 12px "Noto Sans KR", sans-serif;
        color: #304b55;
        box-shadow: 0 5px 20px #172b3622;
      }
      .help {
        position: fixed;
        left: 14px;
        bottom: 14px;
        z-index: 3;
        line-height: 1.85;
        border-radius: 14px;
        font-weight: 500;
      }
      #gauge {
        position: fixed;
        left: 18px;
        top: 62px;
        z-index: 3;
        width: 240px;
        background: var(--glass);
        border-radius: 14px;
        padding: 8px 11px;
        font-size: 12px;
        font-weight: 800;
        box-shadow: 0 5px 20px #172b3622;
      }
      #bar {
        height: 12px;
        border-radius: 9px;
        background: #d7dfdc;
        margin-top: 5px;
        overflow: hidden;
      }
      #fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #e4573d, #f2a33a);
        transition: width 0.25s;
      }
      #toast {
        position: fixed;
        left: 50%;
        bottom: 28px;
        transform: translateX(-50%);
        z-index: 8;
        background: #203541ee;
        color: #fff;
        padding: 11px 18px;
        border-radius: 30px;
        font-size: 13px;
        font-weight: 700;
        opacity: 0;
        transition: 0.2s;
        pointer-events: none;
        white-space: nowrap;
      }
      #toast.show {
        opacity: 1;
        bottom: 40px;
      }
      #actionbar {
        position: fixed;
        right: 18px;
        bottom: 18px;
        z-index: 4;
        display: flex;
        gap: 8px;
      }
      .action {
        border: 1px solid #fff9;
        background: #fffbf0ee;
        color: #29424b;
        border-radius: 13px;
        padding: 12px 15px;
        font: 800 12px "Noto Sans KR", sans-serif;
        cursor: pointer;
        transition: transform 0.1s;
      }
      .action:active {
        transform: scale(0.92);
      }
      #fx {
        position: fixed;
        inset: 0;
        z-index: 7;
        pointer-events: none;
        overflow: hidden;
      }
      .pop {
        position: absolute;
        font: 400 34px "Black Han Sans", sans-serif;
        color: #fff;
        transform: translate(-50%, -50%) rotate(-7deg);
        -webkit-text-stroke: 6px #c0392b;
        paint-order: stroke fill;
        animation: pop 0.8s ease-out forwards;
        white-space: nowrap;
      }
      @keyframes pop {
        0% {
          transform: translate(-50%, -20%) rotate(-7deg) scale(0.2);
          opacity: 0;
        }
        20% {
          transform: translate(-50%, -50%) rotate(-7deg) scale(1.35);
          opacity: 1;
        }
        100% {
          transform: translate(-50%, -130%) rotate(-7deg) scale(1);
          opacity: 0;
        }
      }
      #comboCount {
        position: fixed;
        left: 50%;
        top: 20%;
        transform: translate(-50%, -50%);
        font: 400 64px "Black Han Sans", sans-serif;
        color: #ffda44;
        -webkit-text-stroke: 4px #d32f2f;
        text-shadow: 0 0 20px rgba(255, 87, 34, 0.8);
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.3s, transform 0.1s;
        z-index: 10;
      }
      #comboCount.active {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.2);
      }
      #flash {
        position: fixed;
        inset: 0;
        z-index: 6;
        background: #fff;
        opacity: 0;
        pointer-events: none;
      }
      #mobile {
        display: none;
        position: fixed;
        left: 14px;
        bottom: max(16px, env(safe-area-inset-bottom));
        z-index: 5;
        width: 124px;
        height: 124px;
        border-radius: 50%;
        background: #eaf2edb8;
        border: 2px solid #ffffffd9;
        touch-action: none;
      }
      #stick {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 52px;
        height: 52px;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        background: linear-gradient(145deg, #fff, #cbd9d4);
        box-shadow: 0 4px 12px #1d344044;
        pointer-events: none;
      }
      #mobileActions {
        display: none;
        position: fixed;
        right: 12px;
        bottom: max(12px, env(safe-area-inset-bottom));
        z-index: 6;
        gap: 6px;
        flex-wrap: wrap;
        justify-content: flex-end;
        width: 156px;
      }
      #mobileActions button {
        width: 74px;
        min-height: 54px;
        border: 1px solid #fffe;
        background: #fffbf0f2;
        border-radius: 16px;
        font: 800 12px "Noto Sans KR", sans-serif;
        color: #29424b;
        touch-action: manipulation;
      }
      @media (max-width: 700px) {
        .brand { font-size: 21px; }
        .tag { font-size: 8px; }
        .top { left: 10px; top: 8px; }
        .hud { right: 7px; top: 7px; flex-wrap: wrap; justify-content: flex-end; max-width: 64vw; }
        .pill { padding: 6px 8px; font-size: 9px; }
        #gauge { left: 10px; top: 48px; width: 150px; }
        .help, #actionbar { display: none; }
        #mobile, #mobileActions { display: flex; }
        #mobileActions { display: flex; }
      }
    </style>
  </head>
  <body>
    <div id="world"></div>
    <div class="top">
      <div class="brand">됴무실</div>
      <div class="tag">OFFICE STRESS BREAK · 극강의 타격감 타임</div>
    </div>
    <div id="gauge">
      <span>😤 스트레스 <span id="pct">100</span>%</span> ·
      <span>💥 파괴 <span id="score">0</span>/1000</span>
      <div id="bar"><div id="fill"></div></div>
    </div>
    <div class="hud">
      <div class="pill" id="status">🏢 오피스 · 액션 폭주 중</div>
    </div>
    <div id="comboCount">1 COMBO!</div>
    <div class="help">
      이동 <b>방향키 / WASD</b><br />주먹 연타 <b>F</b> (콤보 연속기)<br />발차기 <b>Space</b> (강력한 회전 차기)<br />드래그로 마우스 시점 회전
    </div>
    <div id="actionbar">
      <button class="action" id="punchBtn">👊 F 주먹 콤보</button>
      <button class="action" id="kickBtn">👟 SPACE 회전 발차기</button>
    </div>
    <div id="mobile"><div id="stick"></div></div>
    <div id="mobileActions">
      <button id="mPunch">👊<br />주먹</button>
      <button id="mKick">👟<br />발차기</button>
    </div>
    <div id="fx"></div>
    <div id="flash"></div>

    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
        }
      }
    </script>
    <script type="module">
      import * as THREE from "three";

      const $ = (s) => document.querySelector(s);
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x8fa1aa);
      scene.fog = new THREE.Fog(0x8fa1aa, 20, 50);

      const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 100);
      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.setSize(innerWidth, innerHeight);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      $("#world").appendChild(renderer.domElement);

      const light = new THREE.DirectionalLight(0xffeedd, 2.5);
      light.position.set(-10, 20, 15);
      light.castShadow = true;
      scene.add(light);
      scene.add(new THREE.AmbientLight(0xffffff, 1.2));

      // ----------------------------------------------------
      // 플레이어 및 관절(Rigging) 모델 구축
      // ----------------------------------------------------
      const playerGroup = new THREE.Group();
      scene.add(playerGroup);

      const skinMat = new THREE.MeshStandardMaterial({ color: 0xffcc99, roughness: 0.5 });
      const suitMat = new THREE.MeshStandardMaterial({ color: 0x223344, roughness: 0.4 });
      const shoeMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
      const trailMat = new THREE.MeshBasicMaterial({ color: 0xffaa00, transparent: true, opacity: 0.6 });

      // 몸통
      const torso = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.8, 0.3), suitMat);
      torso.position.y = 1.1;
      playerGroup.add(torso);

      // 머리
      const head = new THREE.Mesh(new THREE.SphereGeometry(0.22, 16, 16), skinMat);
      head.position.y = 0.6;
      torso.add(head);

      // 어깨 관절 & 오른팔 (주먹)
      const rightShoulder = new THREE.Group();
      rightShoulder.position.set(0.38, 0.3, 0);
      torso.add(rightShoulder);

      const rightArm = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.07, 0.5), suitMat);
      rightArm.position.y = -0.25;
      rightShoulder.add(rightArm);

      const rightFist = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.16, 0.2), skinMat);
      rightFist.position.set(0, -0.28, 0.1);
      rightArm.add(rightFist);

      // 왼팔
      const leftShoulder = new THREE.Group();
      leftShoulder.position.set(-0.38, 0.3, 0);
      torso.add(leftShoulder);

      const leftArm = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.07, 0.5), suitMat);
      leftArm.position.y = -0.25;
      leftShoulder.add(leftArm);

      const leftFist = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.16, 0.2), skinMat);
      leftFist.position.set(0, -0.28, 0.1);
      leftArm.add(leftFist);

      // 고관절 & 오른다리 (발차기)
      const rightHip = new THREE.Group();
      rightHip.position.set(0.18, -0.4, 0);
      torso.add(rightHip);

      const rightLeg = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.08, 0.6), suitMat);
      rightLeg.position.y = -0.3;
      rightHip.add(rightLeg);

      const rightFoot = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.12, 0.35), shoeMat);
      rightFoot.position.set(0, -0.32, 0.1);
      rightLeg.add(rightFoot);

      // 왼다리
      const leftHip = new THREE.Group();
      leftHip.position.set(-0.18, -0.4, 0);
      torso.add(leftHip);

      const leftLeg = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.08, 0.6), suitMat);
      leftLeg.position.y = -0.3;
      leftHip.add(leftLeg);

      // ----------------------------------------------------
      // 사무실 파괴용 사물들
      // ----------------------------------------------------
      const targets = [];
      function createTarget(x, z, name) {
        const mesh = new THREE.Mesh(
          new THREE.BoxGeometry(1, 1.2, 1),
          new THREE.MeshStandardMaterial({ color: 0x8b5a2b })
        );
        mesh.position.set(x, 0.6, z);
        mesh.castShadow = true;
        mesh.userData = { name, hp: 100 };
        scene.add(mesh);
        targets.push(mesh);
      }
      createTarget(0, -2, "책상");
      createTarget(-2, -1.5, "캐비닛");
      createTarget(2, -1.5, "파티션");

      // 바닥
      const floor = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), new THREE.MeshStandardMaterial({ color: 0xcccccc }));
      floor.rotation.x = -Math.PI / 2;
      scene.add(floor);

      // ----------------------------------------------------
      // 현란한 애니메이션 & 공격 시스템
      // ----------------------------------------------------
      let isAttacking = false;
      let combo = 0;
      let comboTimer = null;
      let cameraShake = 0;

      // 특수효과: 잔상 메쉬 궤적
      function createSlashEffect(pos, scale = 1, isKick = false) {
        const geo = isKick ? new THREE.TorusGeometry(0.8, 0.08, 8, 24, Math.PI) : new THREE.ConeGeometry(0.4, 1.2, 16);
        const mat = new THREE.MeshBasicMaterial({
          color: isKick ? 0xff3300 : 0xffaa00,
          transparent: true,
          opacity: 0.8
        });
        const slash = new THREE.Mesh(geo, mat);
        slash.position.copy(pos);
        slash.rotation.x = Math.PI / 2;
        slash.rotation.z = playerGroup.rotation.y + (isKick ? 0 : Math.PI / 2);
        slash.scale.set(scale, scale, scale);
        scene.add(slash);

        let op = 0.8;
        const fade = setInterval(() => {
          op -= 0.1;
          slash.scale.multiplyScalar(1.08);
          slash.material.opacity = op;
          if (op <= 0) {
            scene.remove(slash);
            clearInterval(fade);
          }
        }, 16);
      }

      // 화면 스파크 이펙트 (2D HTML UI)
      function triggerHitFx(x, y, text) {
        const pop = document.createElement("div");
        pop.className = "pop";
        pop.innerText = text;
        pop.style.left = `${x}px`;
        pop.style.top = `${y}px`;
        $("#fx").appendChild(pop);
        setTimeout(() => pop.remove(), 800);
      }

      // 카메라 쉐이크
      function doShake(amount) {
        cameraShake = amount;
      }

      function updateCombo() {
        combo++;
        const el = $("#comboCount");
        el.innerText = `${combo} COMBO!`;
        el.classList.add("active");
        clearTimeout(comboTimer);
        comboTimer = setTimeout(() => {
          combo = 0;
          el.classList.remove("active");
        }, 1200);
      }

      // ----------------------------------------------------
      // 주먹 공격 (F 키) : 3단 무술 콤보 모션
      // ----------------------------------------------------
      function doPunch() {
        if (isAttacking) return;
        isAttacking = true;
        updateCombo();

        const step = combo % 3;
        const speed = 1.8;
        let frame = 0;

        const punchAnim = setInterval(() => {
          frame++;
          const progress = frame / 15;

          if (step === 1) {
            // 1타: 오른손 라이트 스트레이트 + 상체 비틀기
            torso.rotation.y = -Math.sin(progress * Math.PI) * 0.6;
            rightShoulder.rotation.x = -Math.sin(progress * Math.PI) * 1.5;
            rightShoulder.position.z = Math.sin(progress * Math.PI) * 0.4;
          } else if (step === 2) {
            // 2타: 왼손 훅 + 앞으로 쏠리기
            torso.rotation.y = Math.sin(progress * Math.PI) * 0.8;
            leftShoulder.rotation.x = -Math.sin(progress * Math.PI) * 1.6;
            leftShoulder.rotation.y = Math.sin(progress * Math.PI) * 0.8;
          } else {
            // 3타: 양손 강력한 양주먹 대형 찌르기
            torso.rotation.x = Math.sin(progress * Math.PI) * 0.4;
            rightShoulder.rotation.x = -Math.sin(progress * Math.PI) * 1.8;
            leftShoulder.rotation.x = -Math.sin(progress * Math.PI) * 1.8;
            playerGroup.position.z -= Math.sin(progress * Math.PI) * 0.08;
          }

          if (frame === 6) {
            // 타격 시점
            const fistWorldPos = new THREE.Vector3();
            rightFist.getWorldPosition(fistWorldPos);
            createSlashEffect(fistWorldPos, 1.2, false);
            doShake(0.15);
            checkImpact(fistWorldPos, 30);
          }

          if (frame >= 15) {
            clearInterval(punchAnim);
            // 원위치 복귀
            torso.rotation.set(0, 0, 0);
            rightShoulder.rotation.set(0, 0, 0);
            leftShoulder.rotation.set(0, 0, 0);
            rightShoulder.position.z = 0;
            isAttacking = false;
          }
        }, 16 / speed);
      }

      // ----------------------------------------------------
      // 발차기 공격 (Space 키) : 360도 공중 회전 돌려차기 모션
      // ----------------------------------------------------
      function doKick() {
        if (isAttacking) return;
        isAttacking = true;
        updateCombo();

        let frame = 0;
        const kickAnim = setInterval(() => {
          frame++;
          const progress = frame / 20;

          // 몸 전체가 360도 회전하며 발을 높게 차올림
          playerGroup.rotation.y += (Math.PI * 2) / 20;
          torso.rotation.x = -Math.sin(progress * Math.PI) * 0.3;
          rightHip.rotation.x = -Math.sin(progress * Math.PI) * 2.2; // 다리 높이 들어올리기
          rightHip.rotation.z = Math.sin(progress * Math.PI) * 0.5;

          if (frame === 10) {
            // 발차기 임팩트 지점
            const footWorldPos = new THREE.Vector3();
            rightFoot.getWorldPosition(footWorldPos);
            createSlashEffect(footWorldPos, 2.0, true);
            doShake(0.3);
            checkImpact(footWorldPos, 60);
          }

          if (frame >= 20) {
            clearInterval(kickAnim);
            rightHip.rotation.set(0, 0, 0);
            torso.rotation.x = 0;
            playerGroup.rotation.y = Math.round(playerGroup.rotation.y / (Math.PI * 2)) * (Math.PI * 2);
            isAttacking = false;
          }
        }, 16);
      }

      // 타격 판정 및 충격 효과 처리
      function checkImpact(hitPos, damage) {
        targets.forEach((t) => {
          if (t.position.distanceTo(hitPos) < 1.8) {
            t.userData.hp -= damage;
            // 피격 사물 흔들림
            t.position.x += (Math.random() - 0.5) * 0.3;
            t.position.z += (Math.random() - 0.5) * 0.3;

            // 팝업 이펙트
            const screenPos = hitPos.clone().project(camera);
            const x = (screenPos.x * 0.5 + 0.5) * innerWidth;
            const y = (-(screenPos.y * 0.5) + 0.5) * innerHeight;
            triggerHitFx(x, y, damage > 40 ? "💥 KICK!" : "👊 CRASH!");

            if (t.userData.hp <= 0) {
              scene.remove(t);
            }
          }
        });
      }

      // ----------------------------------------------------
      // 키보드 & 클릭 조작 이벤트
      // ----------------------------------------------------
      window.addEventListener("keydown", (e) => {
        if (e.code === "KeyF") doPunch();
        if (e.code === "Space") doKick();
      });

      $("#punchBtn").addEventListener("click", doPunch);
      $("#kickBtn").addEventListener("click", doKick);
      $("#mPunch").addEventListener("click", doPunch);
      $("#mKick").addEventListener("click", doKick);

      // 카메라 조작용 마우스 변수
      let isDragging = false, prevX = 0;
      window.addEventListener("pointerdown", (e) => { isDragging = true; prevX = e.clientX; });
      window.addEventListener("pointermove", (e) => {
        if (isDragging) {
          playerGroup.rotation.y -= (e.clientX - prevX) * 0.01;
          prevX = e.clientX;
        }
      });
      window.addEventListener("pointerup", () => isDragging = false);

      // ----------------------------------------------------
      // 메인 랜더링 루프
      // ----------------------------------------------------
      camera.position.set(0, 3.5, 4.5);
      camera.lookAt(0, 1.2, 0);

      function animate() {
        requestAnimationFrame(animate);

        // 카메라 쉐이크 연출 적용
        if (cameraShake > 0) {
          camera.position.x = (Math.random() - 0.5) * cameraShake;
          camera.position.y = 3.5 + (Math.random() - 0.5) * cameraShake;
          cameraShake -= 0.015;
        } else {
          camera.position.set(0, 3.5, 4.5);
        }

        renderer.render(scene, camera);
      }
      animate();

      window.addEventListener("resize", () => {
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
      });
    </script>
  </body>
</html>
