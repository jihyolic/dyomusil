<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
    />
    <title>됴무실 — Office Stress Break</title>
    <meta
      name="description"
      content="직장 스트레스를 게임 속에서 마음껏 해소하는 됴무실"
    />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@500;700;800&display=swap");
      :root {
        --ink: #25313d;
        --glass: rgba(255, 255, 255, 0.9);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: "Noto Sans KR", sans-serif;
        background: #9eb4bd;
        color: var(--ink);
        -webkit-user-select: none;
        user-select: none;
      }
      canvas {
        display: block;
        touch-action: none;
      }
      .top {
        position: fixed;
        left: 18px;
        top: 14px;
        z-index: 3;
        color: #fff;
        text-shadow:
          0 2px 0 #b3392c,
          0 3px 12px #182b36;
      }
      .brand {
        font:
          400 30px "Black Han Sans",
          sans-serif;
        letter-spacing: 3px;
      }
      .tag {
        font-size: 11px;
        font-weight: 700;
      }
      .hud {
        position: fixed;
        right: 14px;
        top: 14px;
        z-index: 3;
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .pill,
      .help {
        border: 1px solid #fffa;
        background: var(--glass);
        border-radius: 99px;
        padding: 8px 13px;
        font:
          700 12px "Noto Sans KR",
          sans-serif;
        color: #304b55;
        box-shadow: 0 5px 20px #172b3622;
      }
      .help {
        position: fixed;
        left: 14px;
        bottom: 14px;
        z-index: 3;
        line-height: 1.85;
        border-radius: 14px;
        font-weight: 500;
      }
      #gauge {
        position: fixed;
        left: 18px;
        top: 62px;
        z-index: 3;
        width: 240px;
        background: var(--glass);
        border-radius: 14px;
        padding: 8px 11px;
        font-size: 12px;
        font-weight: 800;
        box-shadow: 0 5px 20px #172b3622;
      }
      #bar {
        height: 12px;
        border-radius: 9px;
        background: #d7dfdc;
        margin-top: 5px;
        overflow: hidden;
      }
      #fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #e4573d, #f2a33a);
        transition: width 0.25s;
      }
      #toast {
        position: fixed;
        left: 50%;
        bottom: 28px;
        transform: translateX(-50%);
        z-index: 8;
        background: #203541ee;
        color: #fff;
        padding: 11px 18px;
        border-radius: 30px;
        font-size: 13px;
        font-weight: 700;
        opacity: 0;
        transition: 0.2s;
        pointer-events: none;
        white-space: nowrap;
      }
      #toast.show {
        opacity: 1;
        bottom: 40px;
      }
      #actionbar {
        position: fixed;
        right: 18px;
        bottom: 18px;
        z-index: 4;
        display: flex;
        gap: 8px;
      }
      .action {
        border: 1px solid #fff9;
        background: #fffbf0ee;
        color: #29424b;
        border-radius: 13px;
        padding: 12px 15px;
        font:
          800 12px "Noto Sans KR",
          sans-serif;
        cursor: pointer;
      }
      .action:active {
        transform: scale(0.95);
      }
      #fx {
        position: fixed;
        inset: 0;
        z-index: 7;
        pointer-events: none;
        overflow: hidden;
      }
      .pop {
        position: absolute;
        font:
          400 34px "Black Han Sans",
          sans-serif;
        color: #fff;
        transform: translate(-50%, -50%) rotate(-7deg);
        -webkit-text-stroke: 6px #c0392b;
        paint-order: stroke fill;
        animation: pop 0.9s ease-out forwards;
        white-space: nowrap;
      }
      @keyframes pop {
        0% {
          transform: translate(-50%, -30%) rotate(-7deg) scale(0.3);
          opacity: 0;
        }
        15% {
          transform: translate(-50%, -60%) rotate(-7deg) scale(1.25);
          opacity: 1;
        }
        100% {
          transform: translate(-50%, -150%) rotate(-7deg) scale(1);
          opacity: 0;
        }
      }
      #flash {
        position: fixed;
        inset: 0;
        z-index: 6;
        background: #fff;
        opacity: 0;
        pointer-events: none;
      }
      #mobile {
        display: none;
        position: fixed;
        left: 14px;
        bottom: max(16px, env(safe-area-inset-bottom));
        z-index: 5;
        width: 124px;
        height: 124px;
        border-radius: 50%;
        background: #eaf2edb8;
        border: 2px solid #ffffffd9;
        touch-action: none;
      }
      #stick {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 52px;
        height: 52px;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        background: linear-gradient(145deg, #fff, #cbd9d4);
        box-shadow: 0 4px 12px #1d344044;
        pointer-events: none;
      }
      #mobileActions {
        display: none;
        position: fixed;
        right: 12px;
        bottom: max(12px, env(safe-area-inset-bottom));
        z-index: 6;
        gap: 6px;
        flex-wrap: wrap;
        justify-content: flex-end;
        width: 156px;
      }
      #mobileActions button {
        width: 74px;
        min-height: 54px;
        border: 1px solid #fffe;
        background: #fffbf0f2;
        border-radius: 16px;
        font:
          800 12px "Noto Sans KR",
          sans-serif;
        color: #29424b;
        touch-action: manipulation;
      }
      #mobileActions button:active {
        transform: scale(0.94);
        background: #dce9e2;
      }
      @media (max-width: 700px) {
        .brand {
          font-size: 21px;
        }
        .tag {
          font-size: 8px;
        }
        .top {
          left: 10px;
          top: 8px;
        }
        .hud {
          right: 7px;
          top: 7px;
        }
        .pill {
          padding: 6px 8px;
          font-size: 9px;
        }
        #gauge {
          left: 10px;
          top: 48px;
          width: 150px;
        }
        .help,
        #actionbar {
          display: none;
        }
        #mobile {
          display: block;
        }
        #mobileActions {
          display: flex;
        }
        #status {
          max-width: 110px;
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
        }
        .pop {
          font-size: 26px;
        }
      }
      @media (max-width: 700px) {
        .hud {
          flex-wrap: wrap;
          justify-content: flex-end;
          max-width: 64vw;
        }
      }
      .tog {
        min-width: 104px;
        background: #d9dedd;
        color: #6b7b82;
        border-color: #fff8;
      }
      .tog.on {
        background: #2f9e6a;
        color: #fff;
        border-color: #2f9e6a;
        box-shadow:
          0 0 0 3px #2f9e6a33,
          0 5px 20px #172b3622;
      }
      #rkhud {
        display: none;
        position: fixed;
        top: 12px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 5;
        gap: 16px;
        align-items: center;
        background: #203541ee;
        color: #fff;
        border-radius: 18px;
        padding: 8px 20px;
        font-weight: 800;
        font-size: 22px;
        white-space: nowrap;
      }
      #rkTime.warn {
        color: #ff7a6a;
      }
      #cd {
        display: none;
        position: fixed;
        left: 0;
        right: 0;
        top: 32%;
        z-index: 35;
        text-align: center;
        font:
          400 110px "Black Han Sans",
          sans-serif;
        color: #fff;
        -webkit-text-stroke: 8px #c0392b;
        paint-order: stroke fill;
        pointer-events: none;
      }
      #modal {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 40;
        background: #10202a99;
        align-items: center;
        justify-content: center;
      }
      .mb {
        background: #fff;
        border-radius: 20px;
        padding: 22px;
        width: min(92vw, 380px);
        max-height: 90vh;
        overflow: auto;
        text-align: center;
        box-shadow: 0 20px 60px #0008;
        font-weight: 700;
      }
      .mb h2 {
        margin: 0 0 8px;
        font-size: 22px;
      }
      .mb p {
        margin: 6px 0;
      }
      .dim {
        color: #6b7b82;
        font-size: 12px;
        font-weight: 600;
      }
      .mb input {
        width: 100%;
        padding: 11px;
        border: 2px solid #cfd8d6;
        border-radius: 12px;
        font: 700 16px inherit;
        text-align: center;
        margin: 8px 0;
      }
      .big {
        font:
          400 52px "Black Han Sans",
          sans-serif;
        color: #c0392b;
        margin: 4px 0;
      }
      .btns {
        display: flex;
        gap: 8px;
        margin-top: 12px;
      }
      .btns button {
        flex: 1;
        border: 0;
        border-radius: 12px;
        padding: 12px;
        font: 800 14px inherit;
        background: #2f9e6a;
        color: #fff;
        cursor: pointer;
      }
      .btns button.sub {
        background: #d9dedd;
        color: #44545b;
      }
      .bt {
        width: 100%;
        border-collapse: collapse;
        margin-top: 8px;
        font-size: 14px;
      }
      .bt td {
        padding: 6px 8px;
        border-bottom: 1px solid #eef1f0;
      }
      .bt td:first-child {
        width: 36px;
      }
      .bt td:last-child {
        text-align: right;
        font-weight: 800;
      }
      .bt tr.me {
        background: #fff3c9;
      }
    </style>

  <body>
    <div id="world"></div>
    <div class="top">
      <div class="brand">됴무실</div>
      <div class="tag">
        OFFICE STRESS BREAK · 오늘의 스트레스는 여기에 두고 가요
      </div>
    </div>
    <div id="gauge">
      <span>😤 스트레스 <span id="pct">100</span>%</span> ·
      <span>💥 파괴 <span id="score">0</span>/1000</span>
      <div id="bar"><div id="fill"></div></div>
    </div>
    <div class="hud">
      <button class="pill" id="rankBtn">🏆 랭크전</button
      ><button class="pill" id="boardBtn">📊 랭킹</button>
      <div class="pill" id="status">🏢 오피스 · 자유 행동</div>
      <button class="pill tog" id="sound">🔇 효과음 OFF</button
      ><button class="pill tog" id="bgm">🎵 배경음 OFF</button>
    </div>
    <div class="help">
      이동 <b>방향키</b><br />집기·던지기 <b>E</b> / 클릭
      (책상·의자·화분도 OK)<br />발차기 <b>Space</b> · 주먹 <b>F</b><br />고함 <b>D</b> · 욕하기 <b>S</b> · 서류 폭죽 <b>A</b><br />벽을 계속 치면 금이 가다 무너져요<br />상사들은
      가까이 가면 도망가요 — 쫓아가서 혼내주세요!<br />드래그로 시점 회전
    </div>
    <div id="actionbar">
      <button class="action" id="pickupBtn">E 집기·던지기</button
      ><button class="action" id="kickBtn">SPACE 발차기</button
      ><button class="action" id="shoutBtn">D 고함</button
      ><button class="action" id="curseBtn">S 🤬 욕하기</button
      ><button class="action" id="punchBtn">F 주먹</button
      ><button class="action" id="rainBtn">A 서류 폭죽</button>
    </div>
    <div id="mobile"><div id="stick"></div></div>
    <div id="mobileActions">
      <button id="mPickup">✋<br />집기·던지기</button
      ><button id="mKick">👟<br />발차기</button
      ><button id="mShout">📢 D<br />고함</button
      ><button id="mCurse">🤬 S<br />욕하기</button
      ><button id="mPunch">👊<br />주먹</button
      ><button id="mRain">🎉 A<br />서류 폭죽</button>
    </div>
    <div id="rkhud">
      ⏱ <span id="rkTime">30.0</span><span>💥 <span id="rkScore">0</span></span>
    </div>
    <div id="cd"></div>
    <div id="modal"></div>
    <div id="fx"></div>
    <div id="flash"></div>
    <div id="toast"></div>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
        }
      }
    </script>
    <script type="module">
      import * as THREE from "three";
      const $ = (s) => document.querySelector(s),
        R = Math.random,
        V = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);
      const MODE = "office";
      const scene = new THREE.Scene();
      const BGC = 0x9eb4bd;
      scene.background = new THREE.Color(BGC);
      scene.fog = new THREE.Fog(BGC, 28, 66);
      const camera = new THREE.PerspectiveCamera(
        innerWidth < 700 ? 62 : 52,
        innerWidth / innerHeight,
        0.1,
        120,
      );
      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.setSize(innerWidth, innerHeight);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.12;
      $("#world").appendChild(renderer.domElement);
      scene.add(new THREE.HemisphereLight(0xeaf4ff, 0x6e777c, 2.1));
      const sun = new THREE.DirectionalLight(0xffedcf, 2.6);
      sun.position.set(-8, 15, 10);
      sun.castShadow = true;
      sun.shadow.mapSize.set(2048, 2048);
      Object.assign(sun.shadow.camera, {
        left: -20,
        right: 20,
        top: 20,
        bottom: -20,
      });
      scene.add(sun);
      const mat = (c, r = 0.8, m = 0) =>
        new THREE.MeshStandardMaterial({
          color: c,
          roughness: r,
          metalness: m,
        });
      const M = {
        floor: mat(0x9ba7a6),
        wall: mat(0xd9dedb),
        blue: mat(0x607d8b),
        navy: mat(0x263d50),
        suit: mat(0x26394c),
        shirt: mat(0xf3f0e7),
        tie: mat(0xc0483c),
        skin: mat(0xe6b994),
        hair: mat(0x342d2b),
        wood: mat(0x9a795c),
        dark: mat(0x303b42),
        screen: mat(0x5aa3b5, 0.3),
        red: mat(0xb45c50),
        green: mat(0x5e806b),
        paper: mat(0xf1eee2),
        metal: mat(0x68777d, 0.35, 0.45),
        glass: mat(0x9dbdca, 0.3),
      };
      function box(p, x, y, z, sx, sy, sz, m) {
        const o = new THREE.Mesh(new THREE.BoxGeometry(sx, sy, sz), m);
        o.position.set(x, y, z);
        o.castShadow = true;
        o.receiveShadow = true;
        p.add(o);
        return o;
      }
      function cyl(p, x, y, z, rt, rb, h, m) {
        const o = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, 12), m);
        o.position.set(x, y, z);
        o.castShadow = true;
        p.add(o);
        return o;
      }
      let spots = [],
        furn = [];
      function loc(x, z, t, lx, lz) {
        return [
          x + lx * Math.cos(t) + lz * Math.sin(t),
          z - lx * Math.sin(t) + lz * Math.cos(t),
        ];
      }
      function buildOffice() {
        // ---- office shell
        box(scene, 0, -0.2, 0, 34, 0.4, 28, M.floor);
        box(scene, 0, 4, -14, 34, 8, 0.35, M.wall);
        box(scene, -17, 4, 0, 0.35, 8, 28, M.wall);
        box(scene, 17, 4, 0, 0.35, 8, 28, M.wall);
        for (const x of [-11, -5, 1, 7, 13])
          box(scene, x, 4.1, -13.78, 4.7, 3.1, 0.08, M.glass);
        box(scene, 0, 3.4, -13.7, 5, 2.1, 0.1, M.paper);
        box(scene, 1, 0.95, -5, 8, 0.22, 2.5, M.wood);
        for (const x of [-2, 0, 2, 4])
          for (const z of [-7.1, -2.9])
            box(scene, x, 0.55, z, 1.1, 0.75, 0.85, M.blue);
        function workstation(x, z, t) {
          const g = new THREE.Group();
          g.position.set(x, 0, z);
          g.rotation.y = t;
          g.userData.label = "책상";
          scene.add(g);
          box(g, 0, 0.88, 0, 2.55, 0.16, 1.25, M.wood);
          box(g, 0, 0.48, -0.52, 2.35, 0.62, 0.09, M.blue);
          box(g, 0, 1.32, -0.98, 2.55, 0.72, 0.1, M.blue);
          for (const dx of [-1.08, 1.08])
            for (const dz of [-0.45, 0.45])
              box(g, dx, 0.43, dz, 0.09, 0.84, 0.09, M.metal);
          box(g, -1.0, 0.3, -0.15, 0.34, 0.58, 0.6, M.dark);
          box(g, -1.0, 0.35, 0.16, 0.2, 0.04, 0.02, M.screen);
          cyl(g, -0.72, 1.07, -0.42, 0.09, 0.1, 0.2, M.dark);
          [M.red, M.blue, M.green, M.tie].forEach((m, i) => {
            const pn = cyl(
              g,
              -0.74 + i * 0.04,
              1.25,
              -0.42,
              0.012,
              0.012,
              0.26,
              m,
            );
            pn.rotation.z = (i - 1.5) * 0.12;
          });
          box(g, 0.8, 1.0, -0.42, 0.3, 0.08, 0.22, M.dark);
          box(g, 0.8, 1.045, -0.38, 0.18, 0.02, 0.1, M.screen);
          [
            [0.36, 1.36, 0xe7d58b],
            [0.52, 1.28, 0xf2a3b3],
            [0.3, 1.2, 0x9fd3a6],
          ].forEach(([x, y, c]) => {
            const n = box(g, x, y, -0.28, 0.11, 0.11, 0.01, mat(c));
            n.rotation.z = (x - 0.4) * 1.5;
          });
          box(g, 0.62, 0.97, 0.14, 0.3, 0.012, 0.26, M.navy);
          for (let n = 0; n < 3; n++) {
            const sh = box(
              g,
              -0.1 + n * 0.16,
              0.97,
              0.5,
              0.4,
              0.012,
              0.3,
              M.paper,
            );
            sh.rotation.y = (n - 1) * 0.14;
          }
          cyl(g, 1.1, 1.1, -0.42, 0.11, 0.12, 0.2, M.red);
          cyl(g, 1.1, 1.28, -0.42, 0.06, 0.06, 0.22, M.green);
          spots.push({ x, z, t });
        }
        [
          [-6, -8, 0],
          [0, -8, 0],
          [6, -8, 0],
          [-6, 5, Math.PI],
          [0, 5, Math.PI],
          [6, 5, Math.PI],
          [-12, -1, 0],
          [-6, -1, 0],
          [0, -1, 0],
          [6, -1, 0],
          [12, -1, 0],
          [-12, 9, Math.PI],
          [-6, 9, Math.PI],
          [0, 9, Math.PI],
          [6, 9, Math.PI],
          [12, 9, Math.PI],
        ].forEach((a) => workstation(...a));
        function plant(x, z) {
          const G = new THREE.Group();
          G.userData.label = "화분";
          scene.add(G);
          cyl(G, x, 0.45, z, 0.25, 0.34, 0.9, M.wood);
          for (let i = 0; i < 7; i++) {
            const a = (i * Math.PI * 2) / 7,
              l = new THREE.Mesh(
                new THREE.SphereGeometry(0.35, 10, 8),
                M.green,
              );
            l.position.set(
              x + Math.cos(a) * 0.35,
              1.35 + (i % 2) * 0.15,
              z + Math.sin(a) * 0.35,
            );
            l.scale.set(0.6, 1.5, 0.55);
            G.add(l);
          }
        }
        plant(-14, -11);
        plant(14, -11);
        plant(-14, 11);
        plant(14, 11);
        for (const z of [-4, 0])
          for (const x of [-15, 15])
            box(scene, x, 1, z, 1.05, 2, 0.85, M.metal);
        const stripes = new THREE.Group();
        stripes.userData.keep = true;
        scene.add(stripes);
        for (let i = -7; i < 7; i++)
          box(
            stripes,
            0,
            0.02,
            i * 2 + 1,
            34,
            0.03,
            1,
            mat(i % 2 ? 0x94a2a1 : 0xa2aeac),
          );
        [
          [-9, 4.6, 0xe4573d],
