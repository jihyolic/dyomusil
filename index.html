const fwd=()=>V(Math.sin(avatar.rotation.y),0,Math.cos(avatar.rotation.y));
function nearest(){let b=null,r=2.4;for(const p of props){if(p.userData.held||p.userData.dead)continue;const d=avatar.position.distanceTo(p.position);if(d<r){r=d;b=p}}return b}
function throwHeld(){if(!held)return;const p=held,d=p.userData;d.held=false;p.position.copy(avatar.position).add(fwd().multiplyScalar(1.1));p.position.y=1.4;d.v.copy(fwd().multiplyScalar(17)).add(V(0,3.2,0));d.spin.set(6+R()*4,8,4);held=null;sfx.throw();pop('휙!',avatar.position.clone().add(V(0,2.6,0)),'#2d6a8a');actionUntil=performance.now()+300;arms.forEach(a=>a.rotation.x=-1.6)}
function pickup(){if(held)return throwHeld();const p=nearest();if(!p)return toast('가까이에 집을 수 있는 물건이 없어요');held=p;p.userData.held=true;p.userData.v.set(0,0,0);p.userData.spin.set(0,0,0);sfx.pickup();toast(p.userData.name+' 들었다! · 클릭 또는 E로 던지기');arms.forEach(a=>a.rotation.x=-2.4)}
function kick(){const f=fwd();let hit=false;actionUntil=performance.now()+320;legs[0].rotation.x=-1.1;
  for(const p of props){const d=p.userData;if(d.held||d.dead)continue;const o=p.position.clone().sub(avatar.position);if(o.length()<2.4&&o.normalize().dot(f)>.1){d.v.copy(f).multiplyScalar(13).add(V(0,3.5,0));d.spin.set(9,6,5);hit=true;pop('퍽!',p.position.clone().add(V(0,1,0)))}}
  for(const n of npcs){const o=n.position.clone().sub(avatar.position);o.y=0;if(o.length()<2.4&&o.normalize().dot(f)>.1){knock(n,f,11,'아야악!!!');hit=true}}
  sfx.kick();if(hit){shake=Math.max(shake,.25);relieve(2)}else toast('휙! 허공에 발차기')}
function shout(){sfx.shout();toast('아아아아악!!! 오늘 스트레스 여기 두고 간다!!!');flash(.55);shake=1.1;actionUntil=performance.now()+900;mouth.scale.set(1.4,6,1);setTimeout(()=>mouth.scale.set(1,1,1),900);
  pop('아아아악!!!',avatar.position.clone().add(V(0,3,0)));
  for(const n of npcs){const o=n.position.clone().sub(avatar.position);o.y=0;if(o.length()<10)knock(n,o.normalize(),9-o.length()*.4,'깜짝이야!')}
  for(const p of props){const d=p.userData;if(d.held||d.dead)continue;const o=p.position.clone().sub(avatar.position);o.y=0;if(o.length()<10){d.v.copy(o.normalize()).multiplyScalar(8).add(V(0,5,0));d.spin.set(R()*8,R()*8,R()*8)}}
  const ring=new THREE.Mesh(new THREE.RingGeometry(.5,.7,48),new THREE.MeshBasicMaterial({color:0xffd36c,transparent:true,opacity:.9,side:THREE.DoubleSide}));ring.rotation.x=-Math.PI/2;ring.position.set(avatar.position.x,.12,avatar.position.z);scene.add(ring);
  const t0=performance.now();(function f(){const t=(performance.now()-t0)/700;ring.scale.setScalar(1+t*14);ring.material.opacity=Math.max(0,.9-t);t<1?requestAnimationFrame(f):(scene.remove(ring),ring.geometry.dispose(),ring.material.dispose())})();relieve(8)}
function paperStorm(){rain(70);toast('서류 폭죽 발사!!');pop('와르르~',avatar.position.clone().add(V(0,3,0)));sfx.throw();relieve(3)}
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(k))e.preventDefault();if(!keys[k]){if(k==='e')pickup();if(k===' ')kick();if(k==='q')shout();if(k==='r')paperStorm()}keys[k]=true});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
// joystick
const joyEl=$('#mobile'),stick=$('#stick'),joy={x:0,y:0,id:null};
function upJoy(e){const r=joyEl.getBoundingClientRect(),max=r.width*.34,dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,l=Math.hypot(dx,dy),s=l>max?max/l:1;joy.x=dx*s/max;joy.y=dy*s/max;stick.style.left=`calc(50% + ${joy.x*max}px)`;stick.style.top=`calc(50% + ${joy.y*max}px)`}
const rstJoy=()=>{joy.x=joy.y=0;joy.id=null;stick.style.left=stick.style.top='50%'};
joyEl.addEventListener('pointerdown',e=>{e.preventDefault();joy.id=e.pointerId;joyEl.setPointerCapture(e.pointerId);upJoy(e)});
joyEl.addEventListener('pointermove',e=>{if(joy.id===e.pointerId)upJoy(e)});
['pointerup','pointercancel','lostpointercapture'].forEach(v=>joyEl.addEventListener(v,rstJoy));
// camera drag / click-to-throw
let drag=null;const cv=renderer.domElement;
cv.addEventListener('pointerdown',e=>{drag={id:e.pointerId,x:e.clientX,y:e.clientY,moved:0};cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag.moved+=Math.abs(dx)+Math.abs(dy);drag.x=e.clientX;drag.y=e.clientY;cameraYaw-=dx*.006;cameraPitch=THREE.MathUtils.clamp(cameraPitch+dy*.005,.15,1.2)});
cv.addEventListener('pointerup',e=>{if(drag&&drag.id===e.pointerId){if(drag.moved<8&&held)throwHeld();drag=null}});
cv.addEventListener('pointercancel',()=>drag=null);
$('#sound').onclick=()=>{soundOn=!soundOn;if(soundOn){initAudio();tone(660,.08,'sine',.04)}$('#sound').textContent=soundOn?'♫ 사운드 켜짐':'♫ 사운드 켜기';toast(soundOn?'효과음을 켰어요':'효과음을 껐어요')};
[['#pickupBtn',pickup],['#kickBtn',kick],['#shoutBtn',shout],['#rainBtn',paperStorm]].forEach(([s,f])=>$(s).onclick=f);
[['#mPickup',pickup],['#mKick',kick],['#mShout',shout],['#mRain',paperStorm]].forEach(([s,f])=>$(s).addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();f()}));
// ---- loop
const clock=new THREE.Clock(),look=V();
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.04),now=performance.now();let moving=false;
  const f=(keys.w||keys.arrowup?1:0)-(keys.s||keys.arrowdown?1:0)-joy.y,sd=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0)+joy.x;
  if(f||sd){const c=Math.cos(cameraYaw),s=Math.sin(cameraYaw),v=V(sd*c-f*s,0,-sd*s-f*c).normalize();
    avatar.position.addScaledVector(v,5.2*dt);avatar.position.x=THREE.MathUtils.clamp(avatar.position.x,-15.5,15.5);avatar.position.z=THREE.MathUtils.clamp(avatar.position.z,-12,12);avatar.rotation.y=Math.atan2(v.x,v.z);moving=true}
  const t=now*.012;
  if(moving&&now>actionUntil){legs[0].rotation.x=Math.sin(t)*.55;legs[1].rotation.x=-Math.sin(t)*.55;if(!held){arms[0].rotation.x=-Math.sin(t)*.35;arms[1].rotation.x=Math.sin(t)*.35}torso.position.y=1.08+Math.abs(Math.sin(t))*.035}
  else if(now>actionUntil){legs.forEach(l=>l.rotation.x=0);if(!held)arms.forEach(a=>a.rotation.x=0);torso.position.y=1.08}
  if(held){held.position.copy(avatar.position).add(fwd().multiplyScalar(.9));held.position.y=1.3;held.rotation.set(0,avatar.rotation.y,0);arms.forEach(a=>a.rotation.x=-2.2)}
  for(const p of props){const d=p.userData;
    if(d.dead){if(now>d.t){d.dead=false;p.visible=true;p.position.copy(d.home);p.rotation.set(0,d.homeR,0);d.v.set(0,0,0)}continue}
    if(d.held)continue;const v=d.v;
    if(v.lengthSq()>.01){p.position.addScaledVector(v,dt);v.y-=14*dt;p.rotation.x+=d.spin.x*dt;p.rotation.y+=d.spin.y*dt;p.rotation.z+=d.spin.z*dt;
      const sp=v.length();
      for(const n of npcs){if(n.userData.down>now)continue;const dx=n.position.x-p.position.x,dz=n.position.z-p.position.z;if(dx*dx+dz*dz<.8&&p.position.y<2.4&&sp>4){knock(n,v.clone().setY(0).normalize(),sp*.6,'아야악!!!');v.multiplyScalar(-.3);d.spin.multiplyScalar(.5)}}
      if(p.position.y<0){p.position.y=0;if(sp>8)smash(p,sp>14);else{v.y=Math.abs(v.y)*.3;v.x*=.7;v.z*=.7;d.spin.multiplyScalar(.6);if(sp>2.5)sfx.hit()}}
      const bx=THREE.MathUtils.clamp(p.position.x,-16.2,16.2),bz=THREE.MathUtils.clamp(p.position.z,-12.8,12.8);
      if(bx!==p.position.x||bz!==p.position.z){p.position.x=bx;p.position.z=bz;if(sp>7)smash(p,true);else{v.x*=-.4;v.z*=-.4}}
      if(!d.dead&&p.position.y<.05&&v.length()<.8){v.set(0,0,0);d.spin.set(0,0,0)}}}
  for(const n of npcs){const d=n.userData;
    if(d.down>now||d.v.lengthSq()>.05){n.position.addScaledVector(d.v,dt);d.v.y-=14*dt;if(n.position.y<0){n.position.y=0;d.v.x*=.8;d.v.z*=.8;d.v.y=0}n.position.x=THREE.MathUtils.clamp(n.position.x,-16,16);n.position.z=THREE.MathUtils.clamp(n.position.z,-12.5,12.5);n.rotation.x=THREE.MathUtils.lerp(n.rotation.x,-1.45,.2)}
    else{n.rotation.x=THREE.MathUtils.lerp(n.rotation.x,0,.12);n.position.lerp(d.home,.04);n.position.y=0;n.position.y+=Math.sin(now*.003+d.ph)*.015}}
  for(let i=debris.length-1;i>=0;i--){const m=debris[i],d=m.userData;d.life-=dt;if(d.flutter!==undefined){m.position.x+=Math.sin(now*.003+d.flutter)*dt*1.2;m.rotation.x+=dt*2;m.rotation.z+=dt*1.5;m.position.addScaledVector(d.v,dt);if(m.position.y<.03){m.position.y=.03;d.v.set(0,0,0)}}else{d.v.y-=14*dt;m.position.addScaledVector(d.v,dt);m.rotation.x+=dt*6;if(m.position.y<.05){m.position.y=.05;d.v.multiplyScalar(.5)}}
    if(d.life<=0){scene.remove(m);m.material.dispose();debris.splice(i,1)}}
  const near=nearest();$('#status').textContent=held?'✋ '+held.userData.name+' 들고 있음 · 클릭으로 던지기':near?'E · '+near.userData.name+' 집기':'🏢 오피스 · 자유 행동';
  look.set(avatar.position.x,1.2,avatar.position.z);
  const dist=10.5,h=Math.cos(cameraPitch)*dist,want=V(avatar.position.x+Math.sin(cameraYaw)*h,Math.sin(cameraPitch)*dist+1,avatar.position.z+Math.cos(cameraYaw)*h);
  camera.position.lerp(want,1-Math.pow(.001,dt));
  if(shake>0){camera.position.add(V((R()-.5)*shake,(R()-.5)*shake,(R()-.5)*shake));shake=Math.max(0,shake-dt*2.2)}
  camera.lookAt(look);renderer.render(scene,camera)}
animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.fov=innerWidth<700?62:52;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
</body></html>
