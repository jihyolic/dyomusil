      for(const n of npcs){if(n.userData.down>now)continue;const dx=n.position.x-p.position.x,dz=n.position.z-p.position.z;if(dx*dx+dz*dz<.8&&p.position.y<2.4&&sp>4){knock(n,v.clone().setY(0).normalize(),sp*.6,'아야악!!!');v.multiplyScalar(-.3);d.spin.multiplyScalar(.5)}}
      if(p.position.y<0){p.position.y=0;if(sp>8)smash(p,sp>14);else{v.y=Math.abs(v.y)*.3;v.x*=.7;v.z*=.7;d.spin.multiplyScalar(.6);if(sp>2.5)sfx.hit()}}
      const bx=THREE.MathUtils.clamp(p.position.x,-16.2,16.2),bz=THREE.MathUtils.clamp(p.position.z,-12.8,12.8);
      if(bx!==p.position.x||bz!==p.position.z){p.position.x=bx;p.position.z=bz;if(sp>7)smash(p,true);else{v.x*=-.4;v.z*=-.4}}
      if(!d.dead&&p.position.y<.05&&v.length()<.8){v.set(0,0,0);d.spin.set(0,0,0)}}}
  for(const n of npcs){const d=n.userData;setFace(n,(d.down>now||d.v.lengthSq()>.05)?'hurt':'normal');
    if(d.down>now||d.v.lengthSq()>.05){n.position.addScaledVector(d.v,dt);d.v.y-=14*dt;if(n.position.y<0){n.position.y=0;d.v.x*=.8;d.v.z*=.8;d.v.y=0}n.position.x=THREE.MathUtils.clamp(n.position.x,-16,16);n.position.z=THREE.MathUtils.clamp(n.position.z,-12.5,12.5);n.rotation.x=THREE.MathUtils.lerp(n.rotation.x,-1.45,.2)}
    else{n.rotation.x=THREE.MathUtils.lerp(n.rotation.x,0,.12);n.position.lerp(d.home,.04);n.position.y=0;n.position.y+=Math.sin(now*.003+d.ph)*.015}}
  for(let i=debris.length-1;i>=0;i--){const m=debris[i],d=m.userData;d.life-=dt;if(d.flutter!==undefined){m.position.x+=Math.sin(now*.003+d.flutter)*dt*1.2;m.rotation.x+=dt*2;m.rotation.z+=dt*1.5;m.position.addScaledVector(d.v,dt);if(m.position.y<.03){m.position.y=.03;d.v.set(0,0,0)}}else{d.v.y-=14*dt;m.position.addScaledVector(d.v,dt);m.rotation.x+=dt*6;if(m.position.y<.05){m.position.y=.05;d.v.multiplyScalar(.5)}}
    if(d.life<=0){scene.remove(m);m.material.dispose();debris.splice(i,1)}}
  for(const o of furn){const d=o.userData;if(!d.fly)continue;o.position.addScaledVector(d.fv,dt);d.fv.y-=16*dt;o.rotation.x+=d.fs.x*dt;o.rotation.y+=d.fs.y*dt;o.rotation.z+=d.fs.z*dt;const fl=d.hp.y>1?.3:0;if(o.position.y<fl){o.position.y=fl;d.fv.y=Math.abs(d.fv.y)*.3;d.fv.x*=.7;d.fv.z*=.7;d.fs.multiplyScalar(.7);if(d.fv.lengthSq()<.6){d.fv.set(0,0,0);d.fs.set(0,0,0)}}o.position.x=THREE.MathUtils.clamp(o.position.x,-16.5,16.5);o.position.z=THREE.MathUtils.clamp(o.position.z,-13,13)}
  for(let i=fires.length-1;i>=0;i--){const m=fires[i],d=m.userData;d.t+=dt;if(d.t<d.delay)continue;m.visible=true;const k=(d.t-d.delay)/d.life;m.scale.setScalar(.3+d.max*Math.min(1,k));m.material.opacity=Math.max(0,.9*(1-k));m.position.y+=dt*1.5;if(k>=1){scene.remove(m);m.material.dispose();fires.splice(i,1)}}
  boomLight.intensity=Math.max(0,boomLight.intensity-dt*500);
  const near=nearest();$('#status').textContent=held?'✋ '+held.userData.name+' 들고 있음 · 클릭으로 던지기':near?'E · '+near.userData.name+' 집기':'🏢 오피스 · 자유 행동';
  look.set(avatar.position.x,1.2,avatar.position.z);
  const dist=10.5,h=Math.cos(cameraPitch)*dist,want=V(avatar.position.x+Math.sin(cameraYaw)*h,Math.sin(cameraPitch)*dist+1,avatar.position.z+Math.cos(cameraYaw)*h);
  camera.position.lerp(want,1-Math.pow(.001,dt));
  if(shake>0){camera.position.add(V((R()-.5)*shake,(R()-.5)*shake,(R()-.5)*shake));shake=Math.max(0,shake-dt*2.2)}
  camera.lookAt(look);renderer.render(scene,camera)}
animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.fov=innerWidth<700?62:52;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
